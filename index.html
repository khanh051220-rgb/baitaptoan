<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học toán cùng Khánh</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/188/188333.png">
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #40916c;
            --light: #d8f3dc;
            --accent: #ff9f1c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%); 
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 95%;
            max-width: 1000px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 45px; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
            position: relative;
            z-index: 1;
        }

        h1 { text-align: center; color: var(--primary); font-size: 32px; margin-bottom: 20px; letter-spacing: 1px; }

        #login-screen { text-align: center; padding: 30px 10px; }
        .input-login { 
            padding: 15px; border: 2px solid #b7e4c7; border-radius: 15px; 
            width: 85%; max-width: 350px; margin-bottom: 15px; font-size: 16px; text-align: center;
        }

        #progress-container { width: 100%; background: #eee; border-radius: 10px; margin-bottom: 25px; height: 15px; overflow: hidden; display:none; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #40916c, #2dc653); transition: 0.4s; }

        #dong-ho { 
            font-size: 22px; font-weight: bold; color: #e63946; 
            text-align: center; margin-bottom: 25px; padding: 15px; 
            background: #fff1f2; border-radius: 20px; border: 2px solid #ffccd5;
        }

        .khung { 
            padding: 25px; margin-bottom: 25px; border-radius: 20px; 
            background: white; border: 1px solid #e9ecef;
            border-left: 10px solid var(--secondary);
            position: relative;
        }

        .cau-dung { border-left-color: #2dc653 !important; background: #f0fff4; }
        .cau-sai { border-left-color: #e63946 !important; background: #fff5f5; }

        button { 
            padding: 15px 35px; cursor: pointer; 
            background: linear-gradient(45deg, #2d6a4f, #52b788); 
            color: white; border: none; border-radius: 50px; 
            font-weight: bold; font-size: 16px;
            position: relative;
            z-index: 10005; 
        }

        label { display: block; padding: 12px; margin: 8px 0; border-radius: 12px; background: #f8f9fa; cursor: pointer; font-size: 18px; }
        input[type='radio'] { accent-color: var(--secondary); transform: scale(1.3); margin-right: 12px; }
        
        .loi-giai { 
            font-style: normal; color: #d90429; margin-top: 15px; 
            display: none; background: #fdf2f2; padding: 12px; border-radius: 10px; line-height: 1.5;
        }

        /* --- WATERMARK OVERLAY (ĐÃ ĐIỀU CHỈNH THƯA HƠN) --- */
        #watermark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.15; /* Giảm nhẹ độ đậm để bớt rối mắt */
            display: none;
            background-repeat: repeat;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <audio id="sound-click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
    <audio id="sound-success" src="https://www.soundjay.com/human/sounds/applause-01.mp3"></audio>

    <div id="watermark-overlay"></div>

<div class="container">
    <div id="login-screen">
        <h1>🌿 EzMath 🌿</h1>
        <p>Chào mừng các em đến với thử thách hôm nay! ✨</p>
        <input type="text" id="student-name" class="input-login" placeholder="👤 Nhập họ và tên..."><br>
        <input type="password" id="student-code" class="input-login" placeholder="🔑 Nhập mã bí mật..."><br>
        <button id="btn-login">🚀 BẮT ĐẦU THỬ THÁCH</button>
    </div>

    <div id="main-content" style="display:none;">
        <h1>✍️ BÀI TẬP RÈN LUYỆN</h1>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div id="dong-ho">⏳ Thời gian còn lại: 15:00</div>
        <div id="vung-chua"></div>
        <div style="text-align: center;">
            <button id="btn-nop-bai">✔️ HOÀN THÀNH & NỘP BÀI</button>
            <button onclick="location.reload()" style="margin-left: 10px; background: #6c757d;">🔄 LÀM ĐỀ MỚI</button>
        </div>
        <div id="ket-qua"></div>
    </div>
</div>

<script>
    var studentNameStored = "", giay = 900, timer, daNopBai = false, soLanViPham = 0;
    const GIOI_HAN_VI_PHAM = 2, SO_CAU_MOI_DE = 5;
    var danhSachHocSinh = { "Nguyễn Văn An": "an123", "Trần Thị Bình": "binh456", "Khánh": "0512" };
    
    var khoCauHoi = [
        { de: "15 + 25 bằng bao nhiêu?", luaChon: ["30", "35", "40", "45"], dung: "40", giaiThich: "Thực hiện phép cộng: 15 + 25 = 40.", anh: "" },
        { de: "Hình tam giác có mấy cạnh?", luaChon: ["2", "3", "4", "5"], dung: "3", giaiThich: "Hình tam giác là hình có 3 cạnh.", anh: "" },
        { de: "Số nào lớn nhất: 89, 98, 100, 99?", luaChon: ["89", "98", "100", "99"], dung: "100", giaiThich: "So sánh các số, 100 là số có 3 chữ số nên lớn nhất.", anh: "" },
        { de: "Kết quả của phép tính 7 x 8 là?", luaChon: ["54", "56", "64", "49"], dung: "56", giaiThich: "Theo bảng cửu chương: 7 x 8 = 56.", anh: "" },
        { de: "Số nào là số chẵn nhỏ nhất có hai chữ số?", luaChon: ["10", "12", "02", "11"], dung: "10", giaiThich: "Số có 2 chữ số bé nhất là 10, và nó là số chẵn.", anh: "" },
        { de: "Một hình vuông có cạnh 5cm. Chu vi là?", luaChon: ["10cm", "20cm", "25cm", "15cm"], dung: "20cm", giaiThich: "Chu vi hình vuông = cạnh x 4 = 5 x 4 = 20cm.", anh: "https://vungoi.vn/lop-3/ly-thuyet-chu-vi-hinh-vuong-s5af95da063f130590a599723.html/image.png" },
        { de: "Số liền trước của 1000 là?", luaChon: ["999", "1001", "990", "900"], dung: "999", giaiThich: "Số liền trước = số đã cho - 1. Ta có: 1000 - 1 = 999.", anh: "" },
        { de: "3 giờ bằng bao nhiêu phút?", luaChon: ["120 phút", "150 phút", "180 phút", "200 phút"], dung: "180 phút", giaiThich: "1 giờ = 60 phút. 3 giờ = 60 x 3 = 180 phút.", anh: "" },
        { de: "Kết quả của 100 - 45 là?", luaChon: ["45", "55", "65", "35"], dung: "55", giaiThich: "Phép trừ: 100 - 45 = 55.", anh: "" },
        { de: "Số gồm 5 trăm và 5 đơn vị là?", luaChon: ["55", "550", "505", "5005"], dung: "505", giaiThich: "5 trăm (500) và 5 đơn vị (5) viết là 505.", anh: "" }
    ];

    var danhSachHienTai = []; 

    document.getElementById('btn-login').addEventListener('click', checkLogin);
    document.getElementById('btn-nop-bai').addEventListener('click', chamDiem);

    function checkLogin() {
        var n = document.getElementById('student-name').value.trim();
        var c = document.getElementById('student-code').value.trim();
        if (danhSachHocSinh[n] === c) {
            studentNameStored = n;
            
            const canvas = document.createElement('canvas');
            // Tăng kích thước canvas để các chữ thưa ra
            canvas.width = 280; 
            canvas.height = 180; 
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 15px Segoe UI';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; // Độ đậm mực vừa phải
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(-Math.PI / 8); 
            ctx.fillText(n, 0, 0);

            const overlay = document.getElementById('watermark-overlay');
            overlay.style.backgroundImage = `url(${canvas.toDataURL()})`;
            overlay.style.display = 'block';

            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            document.getElementById('progress-container').style.display = "block";
            taoDe();
            batDauDemNguoc();
        } else { alert("Sai thông tin rồi em ơi! ❌"); }
    }

    function taoDe() {
        var v = document.getElementById('vung-chua'); 
        v.innerHTML = "";
        danhSachHienTai = khoCauHoi.sort(() => 0.5 - Math.random()).slice(0, SO_CAU_MOI_DE);
        danhSachHienTai.forEach((item, i) => {
            var html = `<div class='khung' id='box${i}'><p style='font-weight:bold; font-size:20px;'>📝 Câu ${i+1}: ${item.de}</p>`;
            var dsLuaChonDaTron = [...item.luaChon].sort(() => 0.5 - Math.random());
            dsLuaChonDaTron.forEach(lc => {
                html += `<label><input type='radio' name='cau${i}' value='${lc}'> ${lc}</label>`;
            });
            html += `<div class='loi-giai' id='note${i}'><b>💡 Đáp án đúng: ${item.dung}</b><br><i>📖 Giải thích: ${item.giaiThich}</i></div></div>`;
            v.innerHTML += html;
        });
    }

    function batDauDemNguoc() {
        timer = setInterval(function() {
            if (daNopBai) return;
            var p = Math.floor(giay / 60), g = giay % 60;
            document.getElementById('dong-ho').innerHTML = "⏳ Thời gian còn lại: " + p + ":" + (g < 10 ? "0" + g : g);
            if (giay-- <= 0) { clearInterval(timer); chamDiem(); }
        }, 1000);
    }

    function chamDiem() {
        if (daNopBai) return; 
        daNopBai = true; 
        clearInterval(timer);
        var d = 0;
        danhSachHienTai.forEach((item, i) => {
            var chon = Array.from(document.getElementsByName('cau' + i)).find(r => r.checked)?.value;
            var b = document.getElementById('box' + i);
            document.getElementById('note' + i).style.display = "block"; 
            if (chon === item.dung) { d++; b.classList.add('cau-dung'); } 
            else { b.classList.add('cau-sai'); }
        });
        var diem = (d / SO_CAU_MOI_DE) * 10;
        if (diem >= 8) banPhaoHoa();
        document.getElementById('ket-qua').innerHTML = `<div style="background:#e9f5ee; padding:20px; border-radius:20px; text-align:center;">
            <p style="font-size:30px; font-weight:bold; color:#d00000;">💯 ${diem} ĐIỂM</p></div>`;
    }

    function banPhaoHoa(){
        var end = Date.now() + 3000;
        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0, y: 0.8 } });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1, y: 0.8 } });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }
</script>
</body>
</html>
