<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Cập nhật tên hiển thị trên tab trình duyệt -->
    <title>Học toán cùng Khánh</title>
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #40916c;
            --light: #d8f3dc;
            --accent: #ff9f1c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%); 
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 750px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 35px; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
        }

        h1 { text-align: center; color: var(--primary); font-size: 32px; margin-bottom: 20px; letter-spacing: 1px; }

        #login-screen { text-align: center; padding: 30px 10px; }
        .input-login { 
            padding: 15px; 
            border: 2px solid #b7e4c7; 
            border-radius: 15px; 
            width: 85%; 
            max-width: 320px; 
            margin-bottom: 15px; 
            font-size: 16px;
            transition: 0.3s;
            text-align: center;
        }
        .input-login:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 10px rgba(64,145,108,0.2); }

        #dong-ho { 
            font-size: 22px; font-weight: bold; color: #e63946; 
            text-align: center; margin-bottom: 25px; padding: 15px; 
            background: #fff1f2; border-radius: 20px; border: 2px solid #ffccd5;
        }

        .khung { 
            padding: 25px; margin-bottom: 25px; border-radius: 20px; 
            background: white; border: 1px solid #e9ecef;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            border-left: 8px solid var(--secondary);
            transition: 0.3s;
        }
        .khung:hover { transform: scale(1.02); }

        .cau-dung { border-left-color: #2dc653 !important; background: #f0fff4; }
        .cau-sai { border-left-color: #e63946 !important; background: #fff5f5; }

        button { 
            padding: 15px 35px; cursor: pointer; 
            background: linear-gradient(45deg, #2d6a4f, #52b788); 
            color: white; border: none; border-radius: 50px; 
            font-weight: bold; font-size: 16px;
            box-shadow: 0 5px 15px rgba(45,106,79,0.3);
            transition: 0.3s;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(45,106,79,0.4); }

        label { 
            display: block; padding: 12px; margin: 8px 0; 
            border-radius: 12px; background: #f8f9fa; cursor: pointer;
            transition: 0.2s;
        }
        label:hover { background: #e9ecef; }
        input[type='radio'] { accent-color: var(--secondary); transform: scale(1.3); margin-right: 12px; }

        #ket-qua { text-align: center; margin-top: 30px; }
        .loi-giai { font-style: italic; color: #d90429; margin-top: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <!-- Thay đổi tên thương hiệu tại giao diện đăng nhập -->
        <h1>🌿 EzMath 🌿</h1>
        <p style="color: #666;">Chào mừng các em đến với thử thách hôm nay! ✨</p>
        <input type="text" id="student-name" class="input-login" placeholder="👤 Nhập họ và tên..."><br>
        <input type="password" id="student-code" class="input-login" placeholder="🔑 Nhập mã bí mật..."><br>
        <button onclick="checkLogin()">🚀 BẮT ĐẦU THỬ THÁCH</button>
    </div>

    <div id="main-content" style="display:none;">
        <h1>✍️ BÀI TẬP RÈN LUYỆN</h1>
        <div id="dong-ho">⏳ Thời gian còn lại: 15:00</div>
        <div id="vung-chua"></div>
        <div style="text-align: center;">
            <button id="btn-nop-bai" onclick="chamDiem()">✔️ HOÀN THÀNH & NỘP BÀI</button>
            <button onclick="location.reload()">🔄 LÀM ĐỀ MỚI</button>
        </div>
        <div id="ket-qua"></div>
    </div>
</div>

<script>
    var studentNameStored = "";
    var giay = 900; 
    var timer;
    var daNopBai = false;

    var danhSachHocSinh = { "Nguyễn Văn An": "an123", "Trần Thị Bình": "binh456", "Khánh": "0512" };
    var danhSach = [
        { de: "15 + 25 bằng bao nhiêu?", luaChon: ["30", "35", "40", "45"], dung: "40" },
        { de: "Hình tam giác có mấy cạnh?", luaChon: ["2", "3", "4", "5"], dung: "3" },
        { de: "Số nào lớn nhất: 89, 98, 100, 99?", luaChon: ["89", "98", "100", "99"], dung: "100" }
    ];

    function checkLogin() {
        var n = document.getElementById('student-name').value.trim();
        var c = document.getElementById('student-code').value.trim();
        if (danhSachHocSinh[n] && danhSachHocSinh[n] === c) {
            studentNameStored = n;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            taoDe();
            batDauDemNguoc();
        } else { alert("Sai thông tin rồi em ơi! ❌"); }
    }

    function batDauDemNguoc() {
        timer = setInterval(function() {
            if (daNopBai) return;
            var p = Math.floor(giay / 60), g = giay % 60;
            document.getElementById('dong-ho').innerHTML = "⏳ Thời gian còn lại: " + p + ":" + (g < 10 ? "0" + g : g);
            if (giay-- <= 0) { clearInterval(timer); chamDiem(); }
        }, 1000);
    }

    var danhSachHienTai = [];
    function taoDe() {
        var v = document.getElementById('vung-chua'); v.innerHTML = "";
        danhSachHienTai = JSON.parse(JSON.stringify(danhSach)).sort(() => 0.5 - Math.random());
        danhSachHienTai.forEach((item, i) => {
            var html = `<div class='khung' id='box${i}'><p style='font-weight:bold;'>📝 Câu ${i+1}: ${item.de}</p>`;
            item.luaChon.sort(() => 0.5 - Math.random()).forEach(lc => {
                html += `<label><input type='radio' name='cau${i}' value='${lc}'> ${lc}</label>`;
            });
            html += `<div class='loi-giai' id='note${i}'>💡 Đáp án đúng: ${item.dung}</div></div>`;
            v.innerHTML += html;
        });
    }

    function chamDiem() {
        if (daNopBai) return; daNopBai = true; clearInterval(timer);
        var d = 0;
        danhSachHienTai.forEach((item, i) => {
            var chon = Array.from(document.getElementsByName('cau'+i)).find(r => r.checked)?.value;
            var b = document.getElementById('box'+i);
            if (chon === item.dung) { d++; b.classList.add('cau-dung'); }
            else { b.classList.add('cau-sai'); document.getElementById('note'+i).style.display = "block"; }
            Array.from(document.getElementsByName('cau'+i)).forEach(r => r.disabled = true);
        });

        var diem = Math.round((d/danhSach.length)*100)/10;
        var icon = diem >= 8 ? "🏆 Tuyệt vời!" : (diem >= 5 ? "👏 Khá lắm!" : "💪 Cố gắng lên!");
        
        document.getElementById('ket-qua').innerHTML = `
            <div style="background:#e9f5ee; padding:20px; border-radius:20px; border:2px solid #b7e4c7;">
                <h2 style="margin:0; color:#1b4332;">${icon}</h2>
                <p style="font-size:40px; font-weight:bold; color:#d00000; margin:10px 0;">💯 ${diem} ĐIỂM</p>
                <p>Em đã đúng ${d}/${danhSach.length} câu. Kết quả đã được gửi cho thầy!</p>
            </div>`;
        document.getElementById('btn-nop-bai').style.display = "none";

        // Gửi dữ liệu về máy chủ (Google Sheets)
        fetch("https://script.google.com/macros/s/AKfycbzSoiKPu8jwc3z4oqwqLu0Gy_kMd-MukfhsvM--SB82WEpGs9bt3-1k6FtSKBYBjts/exec", {
            method: "POST", mode: "no-cors", body: JSON.stringify({hoTen: studentNameStored, soCauDung: d+"/"+danhSach.length, diemSo: diem})
        });
    }
    // --- CHỨC NĂNG CHỐNG GIAN LẬN ---
var soLanViPham = 0;
const GIOI_HAN_VI_PHAM = 3;

// Theo dõi sự kiện người dùng chuyển Tab hoặc ẩn trình duyệt
document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === 'hidden' && !daNopBai && studentNameStored !== "") {
        soLanViPham++;
        
        if (soLanViPham < GIOI_HAN_VI_PHAM) {
            alert("⚠️ CẢNH BÁO: Em không được rời khỏi trang làm bài! \nVi phạm thêm " + (GIOI_HAN_VI_PHAM - soLanViPham) + " lần nữa hệ thống sẽ tự động nộp bài.");
        } else {
            alert("❌ VI PHẠM QUÁ NHIỀU: Hệ thống tự động nộp bài của em!");
            chamDiem(); // Tự động nộp bài khi vi phạm quá số lần
        }
    }
});

// Chặn chuột phải (để học sinh không copy câu hỏi đi tra Google nhanh được)
document.addEventListener('contextmenu', event => {
    if (!daNopBai && studentNameStored !== "") {
        event.preventDefault();
        alert("🤫  Khánh nhắc: Tập trung làm bài, đừng dùng chuột phải nhé!");
    }
});

</script>
</body>
</html>
