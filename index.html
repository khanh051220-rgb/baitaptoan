<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học toán cùng Khánh</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/188/188333.png">
    <style>
        :root { --primary: #1b4332; --secondary: #40916c; --light: #d8f3dc; --accent: #ff9f1c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%); min-height: 100vh; margin: 0; display: flex; justify-content: center; }
        .container { width: 95%; max-width: 1000px; background: rgba(255, 255, 255, 0.95); padding: 45px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); font-size: 32px; margin-bottom: 20px; letter-spacing: 1px; }
        #login-screen { text-align: center; padding: 10px; }
        .input-login { padding: 15px; border: 2px solid #b7e4c7; border-radius: 15px; width: 85%; max-width: 350px; margin-bottom: 15px; font-size: 16px; text-align: center; }
        .avatar-picker { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .avatar-option { width: 60px; height: 60px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: 0.3s; background: #eee; object-fit: cover; }
        .avatar-option.selected { border-color: var(--accent); transform: scale(1.1); box-shadow: 0 0 10px rgba(255,159,28,0.5); }
        .header-profile { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; background: #f0fdf4; padding: 10px; border-radius: 50px; }
        .header-profile img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        #progress-container { width: 100%; background: #eee; border-radius: 10px; margin-bottom: 25px; height: 15px; overflow: hidden; display:none; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #40916c, #2dc653); transition: 0.4s; }
        #dong-ho { font-size: 22px; font-weight: bold; color: #e63946; text-align: center; margin-bottom: 25px; padding: 15px; background: #fff1f2; border-radius: 20px; border: 2px solid #ffccd5; }
        .khung { padding: 25px; margin-bottom: 25px; border-radius: 20px; background: white; border: 1px solid #e9ecef; border-left: 10px solid var(--secondary); transition: 0.3s; }
        .cau-dung { border-left-color: #2dc653 !important; background: #f0fff4; }
        .cau-sai { border-left-color: #e63946 !important; background: #fff5f5; }
        button { padding: 15px 35px; cursor: pointer; background: linear-gradient(45deg, #2d6a4f, #52b788); color: white; border: none; border-radius: 50px; font-weight: bold; font-size: 16px; }
        label { display: block; padding: 12px; margin: 8px 0; border-radius: 12px; background: #f8f9fa; cursor: pointer; font-size: 18px; }
        input[type='radio'] { accent-color: var(--secondary); transform: scale(1.3); margin-right: 12px; }
        .loi-giai { margin-top: 15px; padding: 10px; border-radius: 10px; display: none; font-weight: 500; line-height: 1.5; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="ai-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
        <div id="ai-bubble" style="background: white; border: 2px solid var(--secondary); padding: 10px 15px; border-radius: 20px; margin-bottom: 10px; font-size: 13px; max-width: 250px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); position: relative;">
            <span id="ai-speech">Chào em!</span>
            <div style="position: absolute; bottom: -10px; right: 20px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 10px solid var(--secondary);"></div>
        </div>
        <div id="chat-box" style="width: 280px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 2px solid var(--secondary); overflow: hidden; display: flex; flex-direction: column;">
            <div style="background: var(--secondary); color: white; padding: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 13px;">💬 TRỢ LÝ EZMATH</span>
                <span id="ask-count" style="font-size: 11px; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px;">Lượt hỏi: 2/2</span>
            </div>
            <div id="chat-content" style="height: 120px; overflow-y: auto; padding: 10px; font-size: 12px; background: #f9f9f9;">
                <p style="color: #666;"><i>Gõ "Gợi ý câu 1" để được giúp đỡ.</i></p>
            </div>
            <div style="display: flex; border-top: 1px solid #eee;">
                <input type="text" id="user-input" placeholder="Hỏi gì đi em..." style="flex: 1; border: none; padding: 10px; outline: none; font-size: 13px;">
                <button id="btn-send" style="padding: 10px; border-radius: 0; font-size: 12px; width: 50px; background: var(--secondary); color: white;">Gửi</button>
            </div>
        </div>
    </div>
    <audio id="sound-click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
    <audio id="sound-success" src="https://www.soundjay.com/human/sounds/applause-01.mp3"></audio>
    <audio id="sound-denied" src="https://www.soundjay.com/buttons/sounds/beep-05.mp3"></audio>

<div class="container">
    <div id="login-screen">
        <h1>🌿 EzMath 🌿</h1>
        <div class="avatar-picker">
            <img src="https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg" class="avatar-option selected" data-seed="https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg">
            <img src="https://i.pinimg.com/originals/6d/dc/3f/6ddc3f9a79c891e0efd6042624e08f51.png" class="avatar-option" data-seed="https://i.pinimg.com/originals/6d/dc/3f/6ddc3f9a79c891e0efd6042624e08f51.png">
            <img src="https://i.pinimg.com/originals/9a/c3/55/9ac355832f81c37f4964583c22bee6a0.jpg" class="avatar-option" data-seed="https://i.pinimg.com/originals/9a/c3/55/9ac355832f81c37f4964583c22bee6a0.jpg">
            <img src="https://antimatter.vn/wp-content/uploads/2022/03/anh-anime-nam-chibi-meo-cute.jpg" class="avatar-option" data-seed="https://antimatter.vn/wp-content/uploads/2022/03/anh-anime-nam-chibi-meo-cute.jpg">
        </div>
        <input type="text" id="student-name" class="input-login" placeholder="👤 Nhập họ và tên..."><br>
        <input type="password" id="student-code" class="input-login" placeholder="🔑 Nhập mã bí mật..."><br>
        <button id="btn-login">🚀 BẮT ĐẦU THỬ THÁCH</button>
    </div>

    <div id="main-content" style="display:none;">
        <div id="profile-header" class="header-profile">
            <img id="user-img" src="">
            <span id="user-name" style="font-weight: bold; color: var(--primary);"></span>
        </div>
        <h1>✍️ BÀI TẬP RÈN LUYỆN</h1>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div id="dong-ho">⏳ Thời gian còn lại: 15:00</div>
        <div id="vung-chua"></div>
        <div style="text-align: center;">
            <button id="btn-nop-bai">✔️ HOÀN THÀNH & NỘP BÀI</button>
            <button onclick="location.reload()" style="margin-left: 10px; background: #6c757d;">🔄 LÀM ĐỀ MỚI</button>
        </div>
        <div id="ket-qua"></div>
    </div>
</div>

<script>
    var studentNameStored = "", giay = 900, timer, daNopBai = false, soLanViPham = 0, soLuotHoi = 2;
    var currentSeed = "https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg"; 
    const GIOI_HAN_VI_PHAM = 2, SO_CAU_MOI_DE = 5;
    var danhSachHocSinh = { "Nguyễn Văn An": "an123", "Trần Thị Bình": "binh456", "Khánh": "0512" };
    var khoCauHoi = [
        { de: "15 + 25 bằng bao nhiêu?", luaChon: ["30", "35", "40", "45"], dung: "40", giaiThich: "Ta có: 15 + 25 = 40.", goiY: "Thử cộng hàng chục trước nhen." },
        { de: "Hình tam giác có mấy cạnh?", luaChon: ["2", "3", "4", "5"], dung: "3", giaiThich: "Tam giác có 3 cạnh.", goiY: "Chữ 'Tam' nghĩa là gì nhỉ?" },
        { de: "Số nào lớn nhất: 89, 98, 100, 99?", luaChon: ["89", "98", "100", "99"], dung: "100", giaiThich: "100 có 3 chữ số nên lớn nhất.", goiY: "Số nào có nhiều chữ số nhất?" },
        { de: "Kết quả của phép tính 7 x 8 là?", luaChon: ["54", "56", "64", "49"], dung: "56", giaiThich: "7 x 8 = 56.", goiY: "Xem lại bảng cửu chương 7 nhé." },
        { de: "Số nào là số chẵn nhỏ nhất có hai chữ số?", luaChon: ["10", "12", "02", "11"], dung: "10", giaiThich: "10 là số chẵn nhỏ nhất có 2 chữ số.", goiY: "Số bắt đầu hàng chục là số mấy?" },
        { de: "Một hình vuông có cạnh 5cm. Chu vi là?", luaChon: ["10cm", "20cm", "25cm", "15cm"], dung: "20cm", giaiThich: "Chu vi = 5 x 4 = 20cm.", goiY: "Cạnh nhân 4 là ra chu vi." },
        { de: "Số liền trước của 1000 là?", luaChon: ["999", "1001", "990", "900"], dung: "999", giaiThich: "1000 - 1 = 999.", goiY: "Bớt đi 1 đơn vị em nhé." },
        { de: "3 giờ bằng bao nhiêu phút?", luaChon: ["120 phút", "150 phút", "180 phút", "200 phút"], dung: "180 phút", giaiThich: "3 x 60 = 180 phút.", goiY: "1 giờ có 60 phút." },
        { de: "Kết quả của 100 - 45 là?", luaChon: ["45", "55", "65", "35"], dung: "55", giaiThich: "100 - 45 = 55.", goiY: "Mượn 1 chục để trừ nhen." },
        { de: "Số gồm 5 trăm và 5 đơn vị là?", luaChon: ["55", "550", "505", "5005"], dung: "505", giaiThich: "500 + 5 = 505.", goiY: "Hàng chục không có thì là số 0." }
    ];
    var danhSachHienTai = []; 

    document.querySelectorAll('.avatar-option').forEach(opt => {
        opt.addEventListener('click', function() {
            document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('selected'));
            this.classList.add('selected');
            currentSeed = this.getAttribute('data-seed');
            document.getElementById('sound-click').play();
        });
    });

    document.getElementById('btn-login').addEventListener('click', checkLogin);
    document.getElementById('btn-nop-bai').addEventListener('click', chamDiem);

    function checkLogin() {
        var n = document.getElementById('student-name').value.trim();
        var c = document.getElementById('student-code').value.trim();
        if (danhSachHocSinh[n] === c) {
            studentNameStored = n;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            document.getElementById('progress-container').style.display = "block";
            document.getElementById('user-img').src = currentSeed;
            document.getElementById('user-name').innerText = studentNameStored;
            taoDe(); batDauDemNguoc();
            aiNoi("Chào " + studentNameStored + "! Chúc em thi tốt! ✨"); 
        } else { alert("Sai thông tin rồi em ơi! ❌"); }
    }

    function batDauDemNguoc() {
        timer = setInterval(function() {
            if (daNopBai) return;
            var p = Math.floor(giay / 60), g = giay % 60;
            document.getElementById('dong-ho').innerHTML = "⏳ Thời gian còn lại: " + p + ":" + (g < 10 ? "0" + g : g);
            if (giay === 300) aiNoi("Còn 5 phút nữa thôi!");
            if (giay <= 0) { clearInterval(timer); chamDiem(); }
            giay--;
        }, 1000);
    }

    function taoDe() {
        var v = document.getElementById('vung-chua'); v.innerHTML = "";
        danhSachHienTai = khoCauHoi.sort(() => 0.5 - Math.random()).slice(0, SO_CAU_MOI_DE);
        danhSachHienTai.forEach((item, i) => {
            item.luaChon.sort(() => 0.5 - Math.random());
            var html = `<div class='khung' id='box${i}'><p><b>Câu ${i+1}: ${item.de}</b></p>`;
            item.luaChon.forEach(lc => { html += `<label><input type='radio' name='cau${i}' value='${lc}'> ${lc}</label>`; });
            html += `<div class='loi-giai' id='note${i}'></div></div>`;
            v.innerHTML += html;
        });
    }

    function chamDiem() {
        if (daNopBai) return; daNopBai = true; clearInterval(timer);
        var d = 0;
        danhSachHienTai.forEach((item, i) => {
            var chon = Array.from(document.getElementsByName('cau' + i)).find(r => r.checked)?.value;
            var b = document.getElementById('box' + i), noteBox = document.getElementById('note' + i);
            noteBox.style.display = "block";
            if (chon === item.dung) { d++; b.classList.add('cau-dung'); noteBox.innerHTML = "🌟 Đúng! " + item.giaiThich; }
            else { b.classList.add('cau-sai'); noteBox.innerHTML = "❌ Sai. Đáp án: " + item.dung + ". " + item.giaiThich; }
        });
        var diem = (d / SO_CAU_MOI_DE) * 10;
        if (diem >= 8) banPhaoHoa();
        document.getElementById('ket-qua').innerHTML = `<div style='text-align:center; padding:20px;'><h2>💯 ${diem} ĐIỂM</h2></div>`;
    }

    function banPhaoHoa(){
        document.getElementById('sound-success').play();
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }

    function aiNoi(msg) {
        const bubble = document.getElementById('ai-bubble');
        document.getElementById('ai-speech').innerText = msg;
        bubble.style.display = 'block';
        setTimeout(() => { bubble.style.display = 'none'; }, 4000);
    }

    document.addEventListener('change', function(e) {
        if(e.target.type === 'radio') {
            document.getElementById('sound-click').play();
            let done = 0;
            for(let i=0; i < SO_CAU_MOI_DE; i++) { if(document.querySelector(`input[name="cau${i}"]:checked`)) done++; }
            document.getElementById('progress-bar').style.width = (done / SO_CAU_MOI_DE) * 100 + "%";
            if (Math.random() > 0.8) aiNoi("Làm tốt lắm, tiếp tục nhé!");
        }
    });

    function xuLyChat() {
        let input = document.getElementById('user-input'), content = document.getElementById('chat-content'), msg = input.value.toLowerCase();
        if (!msg) return;
        content.innerHTML += `<p><b>Em:</b> ${input.value}</p>`;
        if (soLuotHoi <= 0) { content.innerHTML += `<p style='color:red;'>Hết lượt hỏi!</p>`; }
        else if (msg.includes("gợi ý")) {
            let match = msg.match(/\d+/), idx = match ? parseInt(match[0]) - 1 : -1;
            if (idx >= 0 && idx < SO_CAU_MOI_DE) {
                content.innerHTML += `<p><b>AI:</b> ${danhSachHienTai[idx].goiY}</p>`;
                soLuotHoi--; document.getElementById('ask-count').innerText = `Lượt hỏi: ${soLuotHoi}/2`;
            } else { content.innerHTML += `<p>Em hỏi câu mấy? (VD: Gợi ý câu 1)</p>`; }
        } else { content.innerHTML += `<p>Hỏi về gợi ý câu nhé!</p>`; }
        input.value = ""; content.scrollTop = content.scrollHeight;
    }
    document.getElementById('btn-send').onclick = xuLyChat;
    document.getElementById('user-input').onkeypress = (e) => { if (e.key === 'Enter') xuLyChat(); };

    function trucXuat() { window.stop(); document.body.innerHTML = "<h1 style='color:red; text-align:center;'>⛔ PHÁT HIỆN GIAN LẬN!</h1>"; setTimeout(() => window.location.replace("https://google.com"), 2000); }
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === 'hidden' && !daNopBai && studentNameStored) { soLanViPham++; if (soLanViPham >= GIOI_HAN_VI_PHAM) chamDiem(); else alert("Cảnh báo rời trang!"); } });
    document.addEventListener('contextmenu', e => { if(!daNopBai && studentNameStored) e.preventDefault(); });
    window.addEventListener('keydown', e => { if ([123, 85, 73, 74].includes(e.keyCode) && (e.ctrlKey || e.shiftKey || e.keyCode === 123)) { e.preventDefault(); trucXuat(); } });
</script>
</body>
</html>
