<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>EzMath - Học Toán Cùng Khánh</title>
    <style>
        :root { --primary: #1b4332; --secondary: #40916c; --light: #d8f3dc; --accent: #ff9f1c; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #d8f3dc, #b7e4c7); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .container { width: 90%; max-width: 800px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .khung { padding: 15px; margin-bottom: 15px; border-radius: 10px; border-left: 5px solid var(--secondary); background: #f9f9f9; }
        .cau-dung { border-left-color: #2dc653; background: #f0fff4; }
        .cau-sai { border-left-color: #e63946; background: #fff5f5; }
        button { padding: 10px 25px; cursor: pointer; background: var(--secondary); color: white; border: none; border-radius: 20px; font-weight: bold; }
        input[type="text"], input[type="password"] { padding: 10px; width: 80%; margin: 10px 0; border: 1px solid #ccc; border-radius: 10px; }
        #chat-box { position: fixed; bottom: 20px; right: 20px; width: 250px; background: white; border: 2px solid var(--secondary); border-radius: 10px; overflow: hidden; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" style="text-align: center;">
        <h1>🌿 EzMath 🌿</h1>
        <input type="text" id="student-name" placeholder="Nhập tên: Khánh"><br>
        <input type="password" id="student-code" placeholder="Mã: 0512"><br>
        <button onclick="checkLogin()">BẮT ĐẦU</button>
    </div>

    <div id="main-content" style="display:none;">
        <div id="dong-ho" style="color: red; font-weight: bold; text-align: right;">Thời gian: 15:00</div>
        <h2 id="welcome-msg"></h2>
        <div id="vung-chua"></div>
        <button id="btn-nop" onclick="chamDiem()">NỘP BÀI</button>
        <div id="ket-qua"></div>
    </div>
</div>

<!-- Trợ lý AI Mini -->
<div id="chat-box" style="display:none;">
    <div style="background: var(--secondary); color: white; padding: 5px 10px;">💬 TRỢ LÝ EZMATH</div>
    <div id="chat-content" style="height: 100px; overflow-y: auto; padding: 10px;"></div>
    <input type="text" id="user-input" placeholder="Hỏi: Gợi ý câu 1" style="width: 100%; border: none; border-top: 1px solid #eee;">
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
    let student = "", time = 900, list = [], solved = false;
    const kho = [
        { de: "15 + 25 = ?", options: ["35", "40", "45"], ans: "40", hint: "Cộng hàng đơn vị trước nè (5+5=10)." },
        { de: "Hình tam giác có mấy cạnh?", options: ["2", "3", "4"], ans: "3", hint: "Tam nghĩa là ba đó em." },
        { de: "7 x 8 = ?", options: ["54", "56", "64"], ans: "56", hint: "Xem lại bảng cửu chương 7 nhé." },
        { de: "Số liền trước 1000?", options: ["999", "1001", "990"], ans: "999", hint: "Lấy 1000 trừ đi 1." },
        { de: "3 giờ bằng bao nhiêu phút?", options: ["120", "180", "200"], ans: "180", hint: "1 giờ có 60 phút, lấy 60 nhân 3." }
    ];

    function checkLogin() {
        const n = document.getElementById('student-name').value;
        const c = document.getElementById('student-code').value;
        if (n === "Khánh" && c === "0512") {
            student = n;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            document.getElementById('chat-box').style.display = "block";
            document.getElementById('welcome-msg').innerText = "Chào " + n + ", chúc em làm bài tốt!";
            taoDe();
            setInterval(demNguoc, 1000);
        } else { alert("Sai thông tin rồi!"); }
    }

    function taoDe() {
        list = [...kho].sort(() => 0.5 - Math.random());
        let h = "";
        list.forEach((item, i) => {
            h += `<div class="khung" id="q${i}"><p><b>Câu ${i+1}: ${item.de}</b></p>`;
            item.options.forEach(o => {
                h += `<label><input type="radio" name="c${i}" value="${o}"> ${o}</label> `;
            });
            h += `<div id="ans${i}" style="margin-top:10px; display:none;"></div></div>`;
        });
        document.getElementById('vung-chua').innerHTML = h;
    }

    function chamDiem() {
        if(solved) return; solved = true;
        let score = 0;
        list.forEach((item, i) => {
            const pick = document.querySelector(`input[name="c${i}"]:checked`)?.value;
            const div = document.getElementById(`q${i}`);
            const res = document.getElementById(`ans${i}`);
            res.style.display = "block";
            if(pick === item.ans) { score++; div.className = "khung cau-dung"; res.innerHTML = "✅ Đúng!"; }
            else { div.className = "khung cau-sai"; res.innerHTML = `❌ Sai. Đáp án: ${item.ans}`; }
        });
        document.getElementById('ket-qua').innerHTML = `<h3>Điểm của bạn: ${score}/${list.length}</h3>`;
        if(score >= 4) confetti();
    }

    function demNguoc() {
        if(solved) return;
        let m = Math.floor(time/60), s = time%60;
        document.getElementById('dong-ho').innerText = `Thời gian: ${m}:${s<10?'0':''}${s}`;
        if(time-- <= 0) chamDiem();
    }

    // Chặn gian lận
    document.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => { if(e.keyCode == 123) alert("Cấm hack!"); });

    // Trợ lý AI
    document.getElementById('user-input').onkeypress = (e) => {
        if(e.key === 'Enter') {
            let msg = e.target.value.toLowerCase();
            let reply = "Anh chỉ gợi ý giải toán thôi, đừng tám chuyện!";
            if(msg.includes("gợi ý câu")) {
                let num = parseInt(msg.match(/\d+/)) - 1;
                if(list[num]) reply = list[num].hint;
            }
            document.getElementById('chat-content').innerHTML += `<p><b>Em:</b> ${msg}</p><p style="color:green"><b>AI:</b> ${reply}</p>`;
            e.target.value = "";
        }
    };
</script>
</body>
</html>
