<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học toán cùng Khánh</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/188/188333.png">
    <style>
        /* KHAI BÁO MÀU SẮC (Để không bị trắng phau) */
        :root {
            --primary: #2d6a4f;
            --secondary: #40916c;
            --bg: #f5f7fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 20px; }

        /* MÀN HÌNH ĐĂNG NHẬP */
        #login-screen {
            max-width: 450px; margin: 50px auto; background: white; padding: 30px;
            border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;
        }

        /* FIX AVATAR TO ĐÙNG */
        .avatar-picker { display: flex; justify-content: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .avatar-option { 
            width: 65px; height: 65px; object-fit: cover; border-radius: 50%; 
            cursor: pointer; border: 3px solid transparent; transition: 0.3s;
        }
        .avatar-option.selected { border-color: var(--secondary); transform: scale(1.1); }

        /* FIX KHUNG NỘI DUNG CHÍNH */
        #main-content { 
            display: none; max-width: 800px; margin: 0 auto; background: white; 
            padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }

        .header-profile { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #eee; }
        #user-img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid var(--secondary); }

        .khung { 
            background: #f9f9f9; padding: 20px; margin-bottom: 20px; 
            border-radius: 15px; border-left: 5px solid #3498db; 
        }

        label { display: block; padding: 12px; margin: 8px 0; background: white; border: 1px solid #ddd; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        label:hover { background: #e3f2fd; border-color: #3498db; }

        /* THANH TIẾN ĐỘ */
        #progress-container { width: 100%; height: 12px; background: #eee; border-radius: 50px; margin: 20px 0; display: none; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--secondary); transition: 0.5s; }

        #dong-ho { font-weight: bold; color: #d00000; margin-bottom: 15px; text-align: right; }

        input.input-login {
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; outline: none;
        }

        button {
            background: var(--primary); color: white; border: none; padding: 15px 25px; 
            border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }

        .loi-giai { display: none; margin-top: 15px; padding: 15px; border-radius: 10px; line-height: 1.5; }
        .cau-dung { border-left-color: #2ecc71 !important; background: #f0fff4; }
        .cau-sai { border-left-color: #e74c3c !important; background: #fff5f5; }

        /* BOX CHAT AI */
        #chat-box { width: 280px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 2px solid var(--secondary); overflow: hidden; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

<div id="ai-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
    <div id="ai-bubble" style="background: white; border: 2px solid var(--secondary); padding: 10px 15px; border-radius: 20px; margin-bottom: 10px; font-size: 13px; max-width: 250px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); position: relative;">
        <span id="ai-speech">Chào em!</span>
    </div>

    <div id="chat-box">
        <div style="background: var(--secondary); color: white; padding: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 13px;">💬 TRỢ LÝ EZMATH</span>
            <span id="ask-count" style="font-size: 11px; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px;">Lượt hỏi: 2/2</span>
        </div>
        <div id="chat-content" style="height: 120px; overflow-y: auto; padding: 10px; font-size: 12px; background: #f9f9f9;">
            <p style="color: #666;"><i>Gõ "Gợi ý câu 1" để được giúp đỡ nhé!</i></p>
        </div>
        <div style="display: flex; border-top: 1px solid #eee;">
            <input type="text" id="user-input" placeholder="Hỏi gì đi em..." style="flex: 1; border: none; padding: 10px; outline: none;">
            <button id="btn-send" style="padding: 10px; border-radius: 0; width: 60px;">Gửi</button>
        </div>
    </div>
</div>

<audio id="sound-click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
<audio id="sound-success" src="https://www.soundjay.com/human/sounds/applause-01.mp3"></audio>
<audio id="sound-denied" src="https://www.soundjay.com/buttons/sounds/beep-05.mp3"></audio>

<div id="login-screen">
    <h1 style="color: var(--primary); margin-bottom: 10px;">🌿 EzMath 🌿</h1>
    <p>Chọn một avatar thật ngầu nhen! ✨</p>
    
    <div class="avatar-picker">
        <img src="https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg" class="avatar-option selected" data-seed="https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg">
        <img src="https://i.pinimg.com/originals/6d/dc/3f/6ddc3f9a79c891e0efd6042624e08f51.png" class="avatar-option" data-seed="https://i.pinimg.com/originals/6d/dc/3f/6ddc3f9a79c891e0efd6042624e08f51.png">
        <img src="https://i.pinimg.com/originals/9a/c3/55/9ac355832f81c37f4964583c22bee6a0.jpg" class="avatar-option" data-seed="https://i.pinimg.com/originals/9a/c3/55/9ac355832f81c37f4964583c22bee6a0.jpg">
        <img src="https://antimatter.vn/wp-content/uploads/2022/03/anh-anime-nam-chibi-meo-cute.jpg" class="avatar-option" data-seed="https://antimatter.vn/wp-content/uploads/2022/03/anh-anime-nam-chibi-meo-cute.jpg">
        <img src="https://png.pngtree.com/png-clipart/20210314/original/pngtree-math-clipart-balloon-cartoon-math-symbol-png-image_6086532.jpg" class="avatar-option" data-seed="https://png.pngtree.com/png-clipart/20210314/original/pngtree-math-clipart-balloon-cartoon-math-symbol-png-image_6086532.jpg">
    </div>
    <input type="text" id="student-name" class="input-login" placeholder="👤 Nhập họ và tên...">
    <input type="password" id="student-code" class="input-login" placeholder="🔑 Nhập mã bí mật...">
    <button id="btn-login" style="width: 100%; margin-top: 10px;">🚀 BẮT ĐẦU THỬ THÁCH</button>
</div>

<div id="main-content">
    <div class="header-profile">
        <img id="user-img" src="">
        <span id="user-name"></span>
    </div>
    <h1 style="margin-bottom: 15px; font-size: 24px;">✍️ BÀI TẬP RÈN LUYỆN</h1>
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="dong-ho">⏳ Còn lại: 15:00</div>
    <div id="vung-chua"></div>
    <div style="text-align: center; margin-top: 20px;">
        <button id="btn-nop-bai" style="background: #27ae60;">✔️ NỘP BÀI</button>
        <button onclick="location.reload()" style="background: #6c757d; margin-left: 10px;">🔄 LÀM ĐỀ MỚI</button>
    </div>
    <div id="ket-qua"></div>
</div>

<script>
    var studentNameStored = "", giay = 900, timer, daNopBai = false, soLanViPham = 0, soLuotHoi = 2;
    var currentSeed = "https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg"; 
    const GIOI_HAN_VI_PHAM = 2, SO_CAU_MOI_DE = 5;
    var danhSachHocSinh = { "Nguyễn Văn An": "an123", "Trần Thị Bình": "binh456", "Khánh": "0512" };
    
    var khoCauHoi = [
        { de: "15 + 25 bằng bao nhiêu?", luaChon: ["30", "35", "40", "45"], dung: "40", giaiThich: "Ta có: 15 + 25 = 40.", goiY: "Thử cộng hàng chục trước: 10+20=30, rồi thêm 5+5." },
        { de: "Hình tam giác có mấy cạnh?", luaChon: ["2", "3", "4", "5"], dung: "3", giaiThich: "Tam giác có 3 cạnh.", goiY: "Hán Việt 'Tam' có nghĩa là Ba đó." },
        { de: "Số nào lớn nhất: 89, 98, 100, 99?", luaChon: ["89", "98", "100", "99"], dung: "100", giaiThich: "100 là số duy nhất có 3 chữ số.", goiY: "Số nào có nhiều chữ số hơn sẽ lớn hơn." },
        { de: "Kết quả của phép tính 7 x 8 là?", luaChon: ["54", "56", "64", "49"], dung: "56", giaiThich: "7 x 8 = 56.", goiY: "Nhớ lại bảng cửu chương 7 hoặc 8." },
        { de: "Số chẵn nhỏ nhất có hai chữ số?", luaChon: ["10", "12", "02", "11"], dung: "10", giaiThich: "Đó là số 10.", goiY: "Số nhỏ nhất có 2 chữ số là 10, nó có phải số chẵn không?" }
    ];

    var danhSachHienTai = []; 

    // Avatar Logic
    document.querySelectorAll('.avatar-option').forEach(opt => {
        opt.onclick = function() {
            document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('selected'));
            this.classList.add('selected');
            currentSeed = this.getAttribute('data-seed');
            document.getElementById('sound-click').play();
        };
    });

    // Login Logic
    document.getElementById('btn-login').onclick = function() {
        var n = document.getElementById('student-name').value.trim();
        var c = document.getElementById('student-code').value.trim();
        if (danhSachHocSinh[n] === c) {
            studentNameStored = n;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            document.getElementById('progress-container').style.display = "block";
            document.getElementById('user-img').src = currentSeed;
            document.getElementById('user-name').innerText = studentNameStored;
            taoDe();
            batDauDemNguoc();
            aiNoi("Chào " + studentNameStored + "! Cố gắng đạt điểm 10 nhé! ✨");
        } else {
            alert("Sai thông tin rồi em ơi! ❌");
        }
    };

    function batDauDemNguoc() {
        timer = setInterval(function() {
            if (daNopBai) return;
            var p = Math.floor(giay / 60), g = giay % 60;
            document.getElementById('dong-ho').innerHTML = "⏳ Còn lại: " + p + ":" + (g < 10 ? "0" + g : g);
            if (giay-- <= 0) { clearInterval(timer); chamDiem(); }
        }, 1000);
    }

    function taoDe() {
        var v = document.getElementById('vung-chua'); 
        v.innerHTML = "";
        danhSachHienTai = khoCauHoi.sort(() => 0.5 - Math.random()).slice(0, SO_CAU_MOI_DE);
        danhSachHienTai.forEach((item, i) => {
            item.luaChon.sort(() => 0.5 - Math.random());
            var html = `<div class='khung' id='box${i}'><p style='font-weight:bold;'>Câu ${i+1}: ${item.de}</p>`;
            item.luaChon.forEach(lc => {
                html += `<label><input type='radio' name='cau${i}' value='${lc}'> ${lc}</label>`;
            });
            html += `<div class='loi-giai' id='note${i}'></div></div>`;
            v.innerHTML += html;
        });
    }

    // Chọn đáp án
    document.addEventListener('change', function(e) {
        if(e.target.type === 'radio' && !daNopBai) {
            document.getElementById('sound-click').play();
            let done = 0;
            for(let i=0; i < SO_CAU_MOI_DE; i++) {
                if(document.querySelector(`input[name="cau${i}"]:checked`)) done++;
            }
            document.getElementById('progress-bar').style.width = (done / SO_CAU_MOI_DE) * 100 + "%";
            if (Math.random() > 0.8) aiNoi("Tốt lắm, tiếp tục nào!");
        }
    });

    document.getElementById('btn-nop-bai').onclick = chamDiem;

    function chamDiem() {
        if (daNopBai) return; 
        daNopBai = true; clearInterval(timer);
        var d = 0;
        danhSachHienTai.forEach((item, i) => {
            var chon = document.querySelector(`input[name="cau${i}"]:checked`)?.value;
            var b = document.getElementById('box' + i);
            var noteBox = document.getElementById('note' + i);
            noteBox.style.display = "block";
            if (chon === item.dung) { d++; b.classList.add('cau-dung'); noteBox.innerHTML = "🌟 Đúng! " + item.giaiThich; }
            else { b.classList.add('cau-sai'); noteBox.innerHTML = "❌ Sai rồi. Đáp án: " + item.dung + ". " + item.giaiThich; }
        });
        var diem = (d / SO_CAU_MOI_DE) * 10;
        document.getElementById('ket-qua').innerHTML = `<div style='text-align:center; padding:20px; background:#e8f5e9; border-radius:20px; margin-top:20px;'><h2>Kết quả: ${diem}/10 Điểm</h2></div>`;
        if (diem >= 8) {
            document.getElementById('sound-success').play();
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }
    }

    function aiNoi(msg) {
        const bubble = document.getElementById('ai-bubble');
        document.getElementById('ai-speech').innerText = msg;
        bubble.style.display = 'block';
        setTimeout(() => { bubble.style.display = 'none'; }, 4000);
    }

    // Chat AI Logic
    document.getElementById('btn-send').onclick = function() {
        let input = document.getElementById('user-input');
        let content = document.getElementById('chat-content');
        let msg = input.value.toLowerCase();
        if(!msg) return;
        content.innerHTML += `<p><b>Em:</b> ${input.value}</p>`;
        if(soLuotHoi <= 0) {
            content.innerHTML += `<p style='color:red;'>AI: Hết lượt rồi em!</p>`;
        } else if(msg.includes("gợi ý")) {
            let match = msg.match(/\d+/);
            let idx = match ? parseInt(match[0]) - 1 : -1;
            if(idx >=0 && idx < SO_CAU_MOI_DE) {
                content.innerHTML += `<p style='color:green;'>AI: ${danhSachHienTai[idx].goiY}</p>`;
                soLuotHoi--;
                document.getElementById('ask-count').innerText = `Lượt hỏi: ${soLuotHoi}/2`;
            }
        }
        input.value = "";
        content.scrollTop = content.scrollHeight;
    };
</script>
</body>
</html>
