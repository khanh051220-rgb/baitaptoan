<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học toán cùng Khánh</title>
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #40916c;
            --light: #d8f3dc;
            --accent: #ff9f1c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%); 
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center; /* Căn giữa dọc cho form */
        }

        /* LÀM FORM TO HƠN */
        .container { 
            width: 95%;
            max-width: 900px; /* Tăng độ rộng tối đa */
            background: rgba(255, 255, 255, 0.95); 
            padding: 50px; /* Tăng khoảng cách bên trong */
            border-radius: 40px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.15); 
        }

        h1 { text-align: center; color: var(--primary); font-size: 40px; margin-bottom: 30px; }

        #login-screen { text-align: center; padding: 20px 0; }
        
        /* CÁC Ô NHẬP LIỆU TO HƠN */
        .input-login { 
            padding: 20px; 
            border: 2px solid #b7e4c7; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 500px; 
            margin-bottom: 20px; 
            font-size: 20px; 
            transition: 0.3s;
            text-align: center;
        }
        .input-login:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 15px rgba(64,145,108,0.2); }

        #dong-ho { 
            font-size: 26px; font-weight: bold; color: #e63946; 
            text-align: center; margin-bottom: 25px; padding: 20px; 
            background: #fff1f2; border-radius: 20px; border: 2px solid #ffccd5;
        }

        /* THANH TIẾN ĐỘ */
        #progress-container { width: 100%; background: #eee; border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
        #progress-bar { width: 0%; height: 15px; background: linear-gradient(90deg, #40916c, #2dc653); transition: 0.5s; }

        .khung { 
            padding: 30px; margin-bottom: 25px; border-radius: 25px; 
            background: white; border: 1px solid #e9ecef;
            border-left: 10px solid var(--secondary);
            font-size: 18px;
        }

        .cau-dung { border-left-color: #2dc653 !important; background: #f0fff4; }
        
        /* HIỆU ỨNG RUNG KHI SAI (ĐÃ SỬA LỖI HIỂN THỊ) */
        .cau-sai { border-left-color: #e63946 !important; background: #fff5f5; animation: shake 0.5s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }

        button { 
            padding: 20px 60px; cursor: pointer; 
            background: linear-gradient(45deg, #2d6a4f, #52b788); 
            color: white; border: none; border-radius: 60px; 
            font-weight: bold; font-size: 20px; transition: 0.3s;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(45,106,79,0.3); }

        label { display: block; padding: 15px; margin: 10px 0; border-radius: 15px; background: #f8f9fa; cursor: pointer; font-size: 18px; }
        label:hover { background: #e9ecef; }
        input[type='radio'] { accent-color: var(--secondary); transform: scale(1.5); margin-right: 15px; }
        .loi-giai { font-style: italic; color: #d90429; margin-top: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h1>🌿 EzMath 🌿</h1>
        <p style="font-size: 18px; color: #666;">Chào mừng các em đến với thử thách hôm nay! ✨</p>
        <input type="text" id="student-name" class="input-login" placeholder="👤 Nhập họ và tên..."><br>
        <input type="password" id="student-code" class="input-login" placeholder="🔑 Nhập mã bí mật..."><br>
        <button id="btn-login">🚀 BẮT ĐẦU THỬ THÁCH</button>
    </div>

    <div id="main-content" style="display:none;">
        <h1>✍️ BÀI TẬP RÈN LUYỆN</h1>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div id="dong-ho">⏳ Thời gian còn lại: 15:00</div>
        <div id="vung-chua"></div>
        <div style="text-align: center;">
            <button id="btn-nop-bai">✔️ HOÀN THÀNH & NỘP BÀI</button>
            <button onclick="location.reload()" style="background: #6c757d; margin-left: 15px;">🔄 LÀM ĐỀ MỚI</button>
        </div>
        <div id="ket-qua"></div>
    </div>
</div>

<script>
    var studentNameStored = "", giay = 900, timer, daNopBai = false, soLanViPham = 0;
    const GIOI_HAN_VI_PHAM = 2, SO_CAU_MOI_DE = 5;
    var danhSachHocSinh = { "Nguyễn Văn An": "an123", "Trần Thị Bình": "binh456", "Khánh": "0512" };
    var khoCauHoi = [
        { de: "15 + 25 bằng bao nhiêu?", luaChon: ["30", "35", "40", "45"], dung: "40" },
        { de: "Hình tam giác có mấy cạnh?", luaChon: ["2", "3", "4", "5"], dung: "3" },
        { de: "Số nào lớn nhất: 89, 98, 100, 99?", luaChon: ["89", "98", "100", "99"], dung: "100" },
        { de: "Kết quả của phép tính 7 x 8 là?", luaChon: ["54", "56", "64", "49"], dung: "56" },
        { de: "Số nào là số chẵn nhỏ nhất có hai chữ số?", luaChon: ["10", "12", "02", "11"], dung: "10" }
    ];

    document.getElementById('btn-login').addEventListener('click', checkLogin);
    document.getElementById('btn-nop-bai').addEventListener('click', chamDiem);

    document.addEventListener('change', function(e) {
        if(e.target.type === 'radio') {
            let soCauDaLam = 0;
            for(let i=0; i < SO_CAU_MOI_DE; i++) {
                if(document.querySelector(`input[name="cau${i}"]:checked`)) soCauDaLam++;
            }
            document.getElementById('progress-bar').style.width = (soCauDaLam / SO_CAU_MOI_DE) * 100 + "%";
        }
    });

    function checkLogin() {
        var n = document.getElementById('student-name').value.trim();
        var c = document.getElementById('student-code').value.trim();
        if (danhSachHocSinh[n] === c) {
            studentNameStored = n;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            taoDe();
            batDauDemNguoc();
        } else { alert("Sai thông tin rồi em ơi! ❌"); }
    }

    function batDauDemNguoc() {
        timer = setInterval(function() {
            if (daNopBai) return;
            var p = Math.floor(giay / 60), g = giay % 60;
            document.getElementById('dong-ho').innerHTML = "⏳ Thời gian còn lại: " + p + ":" + (g < 10 ? "0" + g : g);
            if (giay-- <= 0) { clearInterval(timer); chamDiem(); }
        }, 1000);
    }

    function taoDe() {
        var v = document.getElementById('vung-chua');
        v.innerHTML = "";
        var d = khoCauHoi.sort(() => 0.5 - Math.random()).slice(0, SO_CAU_MOI_DE);
        d.forEach((item, i) => {
            var html = `<div class='khung' id='box${i}'><p><b>📝 Câu ${i+1}: ${item.de}</b></p>`;
            item.luaChon.forEach(lc => {
                html += `<label><input type='radio' name='cau${i}' value='${lc}'> ${lc}</label>`;
            });
            html += `<div class='loi-giai' id='note${i}'>💡 Đáp án đúng: ${item.dung}</div></div>`;
            v.innerHTML += html;
        });
    }

    function chamDiem() {
        if (daNopBai) return;
        daNopBai = true; clearInterval(timer);
        var d = 0;
        for(let i=0; i<SO_CAU_MOI_DE; i++){
            var r = document.querySelector(`input[name="cau${i}"]:checked`)?.value;
            var b = document.getElementById('box'+i);
            if(r === khoCauHoi[i].dung) { d++; b.classList.add('cau-dung'); }
            else { b.classList.add('cau-sai'); document.getElementById('note'+i).style.display="block"; }
        }
        document.getElementById('ket-qua').innerHTML = `<h2>Kết quả: ${d}/${SO_CAU_MOI_DE} câu đúng!</h2>`;
    }
</script>
</body>
</html>
