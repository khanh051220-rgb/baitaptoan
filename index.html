<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học toán cùng Khánh</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/188/188333.png">
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #40916c;
            --light: #d8f3dc;
            --accent: #ff9f1c;
        }

        * { box-sizing: border-box; } /* Quan trọng để không bị lỗi trắng xóa/tràn lề */

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%); 
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center; /* Căn giữa màn hình */
            padding: 10px;
        }

        .container { 
            width: 100%;
            max-width: 600px; /* Thu nhỏ lại cho đẹp ở màn hình đăng nhập */
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
        }

        h1 { text-align: center; color: var(--primary); font-size: 28px; margin-bottom: 10px; }

        #login-screen { text-align: center; }
        
        .input-login { 
            padding: 12px; 
            border: 2px solid #b7e4c7; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 300px; 
            margin-bottom: 15px; 
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .avatar-picker {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .avatar-option {
            width: 55px; /* Cố định kích thước */
            height: 55px;
            border-radius: 50%;
            border: 3px solid #eee;
            cursor: pointer;
            transition: 0.3s;
            object-fit: cover; /* Giúp ảnh không bị móp méo */
        }

        .avatar-option.selected {
            border-color: var(--accent);
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(255,159,28,0.5);
        }

        /* Rank Badge */
        @keyframes shine {
            from { filter: drop-shadow(0 0 5px #fff); }
            to { filter: drop-shadow(0 0 15px var(--color)); }
        }
        .rank-badge {
            display: inline-block;
            padding: 10px 25px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
            animation: shine 1s ease-in-out infinite alternate;
        }

        .header-profile {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-bottom: 20px; background: #f0fdf4;
            padding: 10px; border-radius: 50px;
        }
        .header-profile img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

        #progress-container { width: 100%; background: #eee; border-radius: 10px; margin-bottom: 20px; height: 12px; overflow: hidden; display:none; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #40916c, #2dc653); transition: 0.4s; }

        #dong-ho { 
            font-size: 18px; font-weight: bold; color: #e63946; 
            text-align: center; margin-bottom: 20px; padding: 10px; 
            background: #fff1f2; border-radius: 15px; border: 1px solid #ffccd5;
        }

        .khung { 
            padding: 20px; margin-bottom: 20px; border-radius: 15px; 
            background: white; border: 1px solid #e9ecef;
            border-left: 8px solid var(--secondary);
        }

        button { 
            padding: 12px 30px; cursor: pointer; 
            background: linear-gradient(45deg, #2d6a4f, #52b788); 
            color: white; border: none; border-radius: 50px; 
            font-weight: bold; font-size: 15px;
        }

        label { display: block; padding: 10px; margin: 5px 0; border-radius: 10px; background: #f8f9fa; cursor: pointer; }
        .loi-giai { margin-top: 10px; padding: 10px; border-radius: 10px; display: none; font-size: 14px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- Chat Box Assistant -->
    <div id="ai-container" style="position: fixed; bottom: 15px; right: 15px; z-index: 1000;">
        <div id="ai-bubble" style="background: white; border: 2px solid var(--secondary); padding: 8px 12px; border-radius: 15px; margin-bottom: 8px; font-size: 12px; max-width: 200px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
            <span id="ai-speech">Chào em!</span>
        </div>
        <div id="chat-box" style="width: 250px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 2px solid var(--secondary); overflow: hidden; display: flex; flex-direction: column; transition: 0.3s;">
            <div style="background: var(--secondary); color: white; padding: 8px; font-weight: bold; display: flex; justify-content: space-between; font-size: 12px;">
                <span>💬 TRỢ LÝ EZMATH</span>
                <span id="ask-count">Hỏi: 2/2</span>
            </div>
            <div id="chat-content" style="height: 100px; overflow-y: auto; padding: 8px; font-size: 12px; background: #f9f9f9;"></div>
            <div style="display: flex; border-top: 1px solid #eee;">
                <input type="text" id="user-input" placeholder="Hỏi gì đi..." style="flex: 1; border: none; padding: 8px; outline: none; font-size: 12px;">
                <button id="btn-send" style="padding: 8px; border-radius: 0; width: 45px; background: var(--secondary); font-size: 11px;">Gửi</button>
            </div>
        </div>
    </div>

    <audio id="sound-click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
    <audio id="sound-success" src="https://www.soundjay.com/human/sounds/applause-01.mp3"></audio>
    <audio id="sound-denied" src="https://www.soundjay.com/buttons/sounds/beep-05.mp3"></audio>

<div class="container">
    <div id="login-screen">
        <h1>🌿 EzMath 🌿</h1>
        <p style="font-size: 14px; color: #666;">Chọn avatar và nhập tên để bắt đầu nhé!</p>
        
        <div class="avatar-picker">
            <img src="https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg" class="avatar-option selected" data-seed="https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg">
            <img src="https://i.pinimg.com/originals/6d/dc/3f/6ddc3f9a79c891e0efd6042624e08f51.png" class="avatar-option" data-seed="https://i.pinimg.com/originals/6d/dc/3f/6ddc3f9a79c891e0efd6042624e08f51.png">
            <img src="https://i.pinimg.com/originals/9a/c3/55/9ac355832f81c37f4964583c22bee6a0.jpg" class="avatar-option" data-seed="https://i.pinimg.com/originals/9a/c3/55/9ac355832f81c37f4964583c22bee6a0.jpg">
            <img src="https://antimatter.vn/wp-content/uploads/2022/03/anh-anime-nam-chibi-meo-cute.jpg" class="avatar-option" data-seed="https://antimatter.vn/wp-content/uploads/2022/03/anh-anime-nam-chibi-meo-cute.jpg">
            <img src="https://png.pngtree.com/png-clipart/20210314/original/pngtree-math-clipart-balloon-cartoon-math-symbol-png-image_6086532.jpg" class="avatar-option" data-seed="https://png.pngtree.com/png-clipart/20210314/original/pngtree-math-clipart-balloon-cartoon-math-symbol-png-image_6086532.jpg">
        </div>
        <input type="text" id="student-name" class="input-login" placeholder="👤 Nhập họ và tên...">
        <input type="password" id="student-code" class="input-login" placeholder="🔑 Nhập mã bí mật...">
        <br>
        <button id="btn-login">🚀 BẮT ĐẦU THỬ THÁCH</button>
    </div>

    <div id="main-content" style="display:none;">
        <div id="profile-header" class="header-profile">
            <img id="user-img" src="">
            <span id="user-name" style="font-weight: bold; color: var(--primary);"></span>
        </div>
        <h1 style="font-size: 22px;">✍️ BÀI TẬP RÈN LUYỆN</h1>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div id="dong-ho">⏳ Thời gian: 15:00</div>
        <div id="vung-chua"></div>
        <div style="text-align: center; margin-top: 20px;">
            <button id="btn-nop-bai">✔️ NỘP BÀI</button>
            <button onclick="location.reload()" style="margin-left: 10px; background: #6c757d;">🔄 LÀM MỚI</button>
        </div>
        <div id="ket-qua"></div>
    </div>
</div>

<script>
    // Toàn bộ logic Javascript giữ nguyên của bạn để đảm bảo tính năng không đổi
    var studentNameStored = "", giay = 900, timer, daNopBai = false, soLanViPham = 0;
    var currentSeed = "https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg"; 
    const GIOI_HAN_VI_PHAM = 2, SO_CAU_MOI_DE = 5;
    var danhSachHocSinh = { "Nguyễn Văn An": "an123", "Trần Thị Bình": "binh456", "Khánh": "0512" };
    
    var khoCauHoi = [
        { de: "15 + 25 bằng bao nhiêu?", luaChon: ["30", "35", "40", "45"], dung: "40", giaiThich: "15 + 25 = 40.", goiY: "Cộng hàng chục trước nhé." },
        { de: "Hình tam giác có mấy cạnh?", luaChon: ["2", "3", "4", "5"], dung: "3", giaiThich: "Tam giác có 3 cạnh.", hinhAnh: "https://i.postimg.cc/0NGCDPDK/WIN-20260501-21-16-15-Pro.jpg" },
        { de: "Số nào lớn nhất: 89, 98, 100, 99?", luaChon: ["89", "98", "100", "99"], dung: "100", giaiThich: "100 là số duy nhất có 3 chữ số." },
        { de: "Kết quả của phép tính 7 x 8 là?", luaChon: ["54", "56", "64", "49"], dung: "56", giaiThich: "7 x 8 = 56." },
        { de: "Số nào là số chẵn nhỏ nhất có hai chữ số?", luaChon: ["10", "12", "02", "11"], dung: "10", giaiThich: "Số 10 là số chẵn nhỏ nhất có 2 chữ số." }
    ];

    var danhSachHienTai = []; 

    document.querySelectorAll('.avatar-option').forEach(opt => {
        opt.addEventListener('click', function() {
            document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('selected'));
            this.classList.add('selected');
            currentSeed = this.getAttribute('data-seed');
            document.getElementById('sound-click').play();
        });
    });

    document.getElementById('btn-login').addEventListener('click', checkLogin);
    document.getElementById('btn-nop-bai').addEventListener('click', chamDiem);

    function checkLogin() {
        var n = document.getElementById('student-name').value.trim();
        var c = document.getElementById('student-code').value.trim();
        if (danhSachHocSinh[n] === c) {
            studentNameStored = n;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            document.getElementById('progress-container').style.display = "block";
            document.getElementById('user-img').src = currentSeed;
            document.getElementById('user-name').innerText = studentNameStored;
            taoDe();
            batDauDemNguoc();
            aiNoi("Chúc " + studentNameStored + " thi tốt nhé! ✨"); 
        } else { 
            alert("Sai thông tin rồi em ơi! ❌"); 
        }
    }

    function taoDe() {
        var v = document.getElementById('vung-chua'); 
        v.innerHTML = "";
        danhSachHienTai = khoCauHoi.sort(() => 0.5 - Math.random()).slice(0, SO_CAU_MOI_DE);
        danhSachHienTai.forEach((item, i) => {
            let html = `<div class='khung' id='box${i}'><p style='font-weight:bold;'>Câu ${i+1}: ${item.de}</p>`;
            item.luaChon.forEach(lc => {
                html += `<label><input type='radio' name='cau${i}' value='${lc}'> ${lc}</label>`;
            });
            html += `<div class='loi-giai' id='note${i}'></div></div>`;
            v.innerHTML += html;
        });
    }

    function batDauDemNguoc() {
        timer = setInterval(function() {
            if (daNopBai) return;
            var p = Math.floor(giay / 60), g = giay % 60;
            document.getElementById('dong-ho').innerHTML = "⏳ Thời gian: " + p + ":" + (g < 10 ? "0" + g : g);
            if (giay-- <= 0) { clearInterval(timer); chamDiem(); }
        }, 1000);
    }

    function chamDiem() {
        if (daNopBai) return; 
        daNopBai = true; 
        clearInterval(timer);
        let d = 0;
        danhSachHienTai.forEach((item, i) => {
            let chon = Array.from(document.getElementsByName('cau' + i)).find(r => r.checked)?.value;
            let b = document.getElementById('box' + i);
            let noteBox = document.getElementById('note' + i);
            noteBox.style.display = "block";
            if (chon === item.dung) { d++; b.style.borderColor = "#2dc653"; noteBox.innerHTML = "🌟 Đúng rồi!"; }
            else { b.style.borderColor = "#e63946"; noteBox.innerHTML = "❌ Sai rồi! Đáp án: " + item.dung; }
        });
        document.getElementById('ket-qua').innerHTML = `<h2 style='text-align:center; color:red;'>KẾT QUẢ: ${d}/${SO_CAU_MOI_DE}</h2>`;
        if(d >= 4) confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }

    function aiNoi(msg) {
        const bubble = document.getElementById('ai-bubble');
        document.getElementById('ai-speech').innerText = msg;
        bubble.style.display = 'block';
        setTimeout(() => { bubble.style.display = 'none'; }, 4000);
    }
</script>
</body>
</html>
