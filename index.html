<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học toán cùng Khánh</title>
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #40916c;
            --light: #d8f3dc;
            --accent: #ff9f1c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%); 
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 750px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 35px; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
            position: relative;
            z-index: 10;
        }

        h1 { text-align: center; color: var(--primary); font-size: 32px; margin-bottom: 20px; letter-spacing: 1px; }

        #login-screen { text-align: center; padding: 30px 10px; }
        .input-login { 
            padding: 15px; 
            border: 2px solid #b7e4c7; 
            border-radius: 15px; 
            width: 85%; 
            max-width: 320px; 
            margin-bottom: 15px; 
            font-size: 16px;
            transition: 0.3s;
            text-align: center;
        }
        .input-login:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 10px rgba(64,145,108,0.2); }

        #dong-ho { 
            font-size: 22px; font-weight: bold; color: #e63946; 
            text-align: center; margin-bottom: 25px; padding: 15px; 
            background: #fff1f2; border-radius: 20px; border: 2px solid #ffccd5;
        }

        .khung { 
            padding: 25px; margin-bottom: 25px; border-radius: 20px; 
            background: white; border: 1px solid #e9ecef;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            border-left: 8px solid var(--secondary);
            transition: 0.3s;
        }
        .khung:hover { transform: scale(1.02); }

        .cau-dung { border-left-color: #2dc653 !important; background: #f0fff4; }
        .cau-sai { border-left-color: #e63946 !important; background: #fff5f5; }

        button { 
            padding: 15px 35px; cursor: pointer; 
            background: linear-gradient(45deg, #2d6a4f, #52b788); 
            color: white; border: none; border-radius: 50px; 
            font-weight: bold; font-size: 16px;
            box-shadow: 0 5px 15px rgba(45,106,79,0.3);
            transition: 0.3s;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(45,106,79,0.4); }

        label { 
            display: block; padding: 12px; margin: 8px 0; 
            border-radius: 12px; background: #f8f9fa; cursor: pointer;
            transition: 0.2s;
        }
        label:hover { background: #e9ecef; }
        input[type='radio'] { accent-color: var(--secondary); transform: scale(1.3); margin-right: 12px; }

        #ket-qua { text-align: center; margin-top: 30px; }
        .loi-giai { font-style: italic; color: #d90429; margin-top: 15px; display: none; font-weight: bold; }
        
        /* CSS cho Canvas pháo hoa */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

<!-- Thẻ canvas đặt ngay dưới body -->
<canvas id="fireworksCanvas"></canvas>

<script>
    // 1. BIẾN TOÀN CỤC
    var studentNameStored = "";
    var giay = 900; 
    var timer;
    var daNopBai = false;
    var soLanViPham = 0; 
    const GIOI_HAN_VI_PHAM = 1; 
    const SO_CAU_MOI_DE = 5;

    var danhSachHocSinh = { "Nguyễn Văn An": "an123", "Trần Thị Bình": "binh456", "Khánh": "0512" };
    var khoCauHoi = [
        { de: "15 + 25 bằng bao nhiêu?", luaChon: ["30", "35", "40", "45"], dung: "40" },
        { de: "Hình tam giác có mấy cạnh?", luaChon: ["2", "3", "4", "5"], dung: "3" },
        { de: "Số nào lớn nhất: 89, 98, 100, 99?", luaChon: ["89", "98", "100", "99"], dung: "100" },
        { de: "Kết quả của phép tính 7 x 8 là?", luaChon: ["54", "56", "64", "49"], dung: "56" },
        { de: "Số nào là số chẵn nhỏ nhất có hai chữ số?", luaChon: ["10", "12", "02", "11"], dung: "10" }
    ];
    var danhSachHienTai = [];

    // 2. GÁN SỰ KIỆN
    document.getElementById('btn-login').addEventListener('click', checkLogin);
    document.getElementById('btn-nop-bai').addEventListener('click', chamDiem);

    // 3. HÀM LOGIC (Login, Tạo đề, Đếm ngược)
    function checkLogin() {
        var n = document.getElementById('student-name').value.trim();
        var c = document.getElementById('student-code').value.trim();
        if (danhSachHocSinh[n] && danhSachHocsinh[n] === c) {
            studentNameStored = n;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            taoDe();
            batDauDemNguoc();
        } else { alert("Sai thông tin rồi em ơi! ❌"); }
    }

    function batDauDemNguoc() {
        timer = setInterval(function() {
            if (daNopBai) return;
            var p = Math.floor(giay / 60), g = giay % 60;
            document.getElementById('dong-ho').innerHTML = "⏳ Thời gian còn lại: " + p + ":" + (g < 10 ? "0" + g : g);
            if (giay-- <= 0) { clearInterval(timer); chamDiem(); }
        }, 1000);
    }

    function taoDe() {
        var v = document.getElementById('vung-chua'); 
        v.innerHTML = "";
        danhSachHienTai = khoCauHoi.sort(() => 0.5 - Math.random()).slice(0, SO_CAU_MOI_DE);
        danhSachHienTai.forEach((item, i) => {
            var html = `<div class='khung' id='box${i}'><p style='font-weight:bold;'>📝 Câu ${i+1}: ${item.de}</p>`;
            let luaChonTron = [...item.luaChon].sort(() => 0.5 - Math.random());
            luaChonTron.forEach(lc => {
                html += `<label><input type='radio' name='cau${i}' value='${lc}'> ${lc}</label>`;
            });
            html += `<div class='loi-giai' id='note${i}'>💡 Đáp án đúng: ${item.dung}</div></div>`;
            v.innerHTML += html;
        });
    }

    // 4. HÀM CHẤM ĐIỂM (Nơi kích hoạt pháo hoa)
    function chamDiem() {
        if (daNopBai) return; 
        daNopBai = true; 
        clearInterval(timer);
        var d = 0;
        danhSachHienTai.forEach((item, i) => {
            var inputs = document.getElementsByName('cau' + i);
            var chon = Array.from(inputs).find(r => r.checked)?.value;
            var b = document.getElementById('box' + i);
            if (chon === item.dung) { d++; b.classList.add('cau-dung'); } 
            else { b.classList.add('cau-sai'); document.getElementById('note' + i).style.display = "block"; }
            Array.from(inputs).forEach(r => r.disabled = true);
        });

        var diem = Math.round((d / danhSachHienTai.length) * 10);
        
        // Kích hoạt pháo hoa nếu đạt 10 điểm
        if (diem === 10) {
            runFireworks();
        }

        var icon = diem >= 8 ? "🏆 Tuyệt vời!" : (diem >= 5 ? "👏 Khá lắm!" : "💪 Cố gắng lên!");
        document.getElementById('ket-qua').innerHTML = `
            <div style="background:#e9f5ee; padding:20px; border-radius:20px; border:2px solid #b7e4c7;">
                <h2 style="margin:0; color:#1b4332;">${icon}</h2>
                <p style="font-size:40px; font-weight:bold; color:#d00000; margin:10px 0;">💯 ${diem} ĐIỂM</p>
                <p>Em đã đúng ${d}/${danhSachHienTai.length} câu.</p>
            </div>`;
        document.getElementById('btn-nop-bai').style.display = "none";
    }

    // 5. HỆ THỐNG PHÁO HOA (CANVAS)
    function runFireworks() {
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        canvas.style.display = "block";
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff9f1c'];

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.velocity = { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 };
                this.alpha = 1;
                this.friction = 0.95;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.012;
            }
        }

        function animate() {
            if (canvas.style.display === "none") return;
            requestAnimationFrame(animate);
            // Xóa màn hình nhẹ để tạo hiệu ứng đuôi
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, i) => {
                if (p.alpha > 0) {
                    p.update();
                    p.draw();
                } else {
                    particles.splice(i, 1);
                }
            });
        }

        let count = 0;
        const interval = setInterval(() => {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height / 2);
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
            }
            count++;
            if (count > 8) clearInterval(interval);
        }, 300);

        animate();
        setTimeout(() => { canvas.style.display = "none"; }, 6000);
    }
</script>
