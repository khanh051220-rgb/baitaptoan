<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học toán cùng Khánh</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/188/188333.png">
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #40916c;
            --light: #d8f3dc;
            --accent: #ff9f1c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%); 
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container { 
            width: 95%;
            max-width: 800px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        h1 { text-align: center; color: var(--primary); font-size: 32px; margin-bottom: 20px; }

        #login-screen { text-align: center; padding: 20px; }
        .input-login { 
            padding: 15px; 
            border: 2px solid #b7e4c7; 
            border-radius: 15px; 
            width: 100%; 
            max-width: 300px; 
            margin-bottom: 15px; 
            font-size: 16px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        #progress-container { width: 100%; background: #eee; border-radius: 10px; margin-bottom: 25px; height: 15px; overflow: hidden; display:none; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #40916c, #2dc653); transition: 0.4s; }

        #dong-ho { 
            font-size: 22px; font-weight: bold; color: #e63946; 
            text-align: center; margin-bottom: 25px; padding: 15px; 
            background: #fff1f2; border-radius: 20px; border: 2px solid #ffccd5;
        }

        .khung { 
            padding: 20px; margin-bottom: 20px; border-radius: 15px; 
            background: white; border: 1px solid #e9ecef;
            border-left: 10px solid var(--secondary);
        }

        .cau-dung { border-left-color: #2dc653 !important; background: #f0fff4; }
        .cau-sai { border-left-color: #e63946 !important; background: #fff5f5; }

        button { 
            padding: 15px 30px; cursor: pointer; 
            background: linear-gradient(45deg, #2d6a4f, #52b788); 
            color: white; border: none; border-radius: 50px; 
            font-weight: bold; font-size: 16px; transition: transform 0.2s;
        }

        button:active { transform: scale(0.95); }

        label { display: block; padding: 10px; margin: 5px 0; border-radius: 10px; background: #f8f9fa; cursor: pointer; }
        input[type='radio'] { margin-right: 10px; }
        .loi-giai { font-style: italic; color: #d90429; margin-top: 10px; display: none; }
    </style>
    <!-- Thư viện pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <audio id="sound-click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
    <audio id="sound-success" src="https://www.soundjay.com/human/sounds/applause-01.mp3"></audio>

<div class="container">
    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen">
        <h1>🌿 EzMath 🌿</h1>
        <p>Chào mừng các em đến với thử thách hôm nay! ✨</p>
        <input type="text" id="student-name" class="input-login" placeholder="👤 Nhập họ và tên...">
        <input type="password" id="student-code" class="input-login" placeholder="🔑 Nhập mã bí mật...">
        <button id="btn-login">🚀 BẮT ĐẦU THỬ THÁCH</button>
    </div>

    <!-- NỘI DUNG CHÍNH -->
    <div id="main-content" style="display:none;">
        <h1>✍️ BÀI TẬP RÈN LUYỆN</h1>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div id="dong-ho">⏳ Thời gian còn lại: 15:00</div>
        <div id="vung-chua"></div>
        <div style="text-align: center;">
            <button id="btn-nop-bai">✔️ HOÀN THÀNH & NỘP BÀI</button>
        </div>
        <div id="ket-qua" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    let studentNameStored = "", giay = 900, timer, daNopBai = false;
    const SO_CAU_MOI_DE = 5;
    const danhSachHocSinh = { "Nguyễn Văn An": "an123", "Trần Thị Bình": "binh456", "Khánh": "0512" };
    
    const khoCauHoi = [
        { de: "15 + 25 bằng bao nhiêu?", luaChon: ["30", "35", "40", "45"], dung: "40" },
        { de: "Hình tam giác có mấy cạnh?", luaChon: ["2", "3", "4", "5"], dung: "3" },
        { de: "Số nào lớn nhất: 89, 98, 100, 99?", luaChon: ["89", "98", "100", "99"], dung: "100" },
        { de: "Kết quả của phép tính 7 x 8 là?", luaChon: ["54", "56", "64", "49"], dung: "56" },
        { de: "Số nào là số chẵn nhỏ nhất có hai chữ số?", luaChon: ["10", "12", "02", "11"], dung: "10" }
    ];

    let danhSachHienTai = [];

    document.getElementById('btn-login').onclick = function() {
        const n = document.getElementById('student-name').value.trim();
        const c = document.getElementById('student-code').value.trim();
        if (danhSachHocSinh[n] === c) {
            studentNameStored = n;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            document.getElementById('progress-container').style.display = "block";
            taoDe();
            batDauDemNguoc();
        } else {
            alert("Sai thông tin rồi em ơi! ❌");
        }
    };

    function taoDe() {
        const v = document.getElementById('vung-chua');
        v.innerHTML = "";
        danhSachHienTai = [...khoCauHoi].sort(() => 0.5 - Math.random()).slice(0, SO_CAU_MOI_DE);
        
        danhSachHienTai.forEach((item, i) => {
            let html = `<div class="khung" id="box${i}"><p><b>Câu ${i+1}: ${item.de}</b></p>`;
            item.luaChon.forEach(lc => {
                html += `<label><input type="radio" name="cau${i}" value="${lc}" onchange="updateProgress()"> ${lc}</label>`;
            });
            html += `<div class="loi-giai" id="note${i}">💡 Đáp án đúng: ${item.dung}</div></div>`;
            v.innerHTML += html;
        });
    }

    function updateProgress() {
        document.getElementById('sound-click').play();
        let done = 0;
        for(let i=0; i < SO_CAU_MOI_DE; i++) {
            if(document.querySelector(`input[name="cau${i}"]:checked`)) done++;
        }
        document.getElementById('progress-bar').style.width = (done / SO_CAU_MOI_DE) * 100 + "%";
    }

    function batDauDemNguoc() {
        timer = setInterval(() => {
            if (giay <= 0) {
                clearInterval(timer);
                chamDiem();
            } else {
                giay--;
                let p = Math.floor(giay / 60);
                let g = giay % 60;
                document.getElementById('dong-ho').innerText = `⏳ Thời gian còn lại: ${p}:${g < 10 ? '0' + g : g}`;
            }
        }, 1000);
    }

    document.getElementById('btn-nop-bai').onclick = chamDiem;

    function chamDiem() {
        if(daNopBai) return;
        daNopBai = true;
        clearInterval(timer);

        let d = 0;
        danhSachHienTai.forEach((item, i) => {
            const selected = document.querySelector(`input[name="cau${i}"]:checked`);
            const box = document.getElementById(`box${i}`);
            if (selected && selected.value === item.dung) {
                d++;
                box.classList.add('cau-dung');
            } else {
                box.classList.add('cau-sai');
                document.getElementById(`note${i}`).style.display = "block";
            }
        });

        const diem = (d / SO_CAU_MOI_DE) * 10;
        if (diem >= 8) banPhaoHoa();

        document.getElementById('ket-qua').innerHTML = `
            <div style="text-align:center; padding:20px; border:2px solid var(--secondary); border-radius:20px;">
                <h2>Kết quả của ${studentNameStored}</h2>
                <p style="font-size:30px; font-weight:bold;">${diem} Điểm</p>
                <p>Bạn đã đúng ${d}/${SO_CAU_MOI_DE} câu!</p>
                <button onclick="location.reload()">LÀM LẠI</button>
            </div>`;
    }

    function banPhaoHoa() {
        document.getElementById('sound-success').play();
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }
</script>
</body>
</html>
