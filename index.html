<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học toán cùng Khánh</title>
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #40916c;
            --light: #d8f3dc;
            --accent: #ff9f1c;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%); 
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .container { 
            width: 100%; max-width: 750px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 35px; border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
        }
        h1 { text-align: center; color: var(--primary); font-size: 32px; }
        #login-screen { text-align: center; padding: 30px 10px; }
        .input-login { 
            padding: 15px; border: 2px solid #b7e4c7; border-radius: 15px; 
            width: 85%; max-width: 320px; margin-bottom: 15px; text-align: center;
        }
        #dong-ho { 
            font-size: 22px; font-weight: bold; color: #e63946; text-align: center; 
            margin-bottom: 25px; padding: 15px; background: #fff1f2; 
            border-radius: 20px; border: 2px solid #ffccd5;
        }
        .khung { 
            padding: 25px; margin-bottom: 25px; border-radius: 20px; 
            background: white; border-left: 8px solid var(--secondary);
        }
        .cau-dung { border-left-color: #2dc653 !important; background: #f0fff4; }
        .cau-sai { border-left-color: #e63946 !important; background: #fff5f5; }
        button { 
            padding: 15px 35px; cursor: pointer; border-radius: 50px; 
            background: linear-gradient(45deg, #2d6a4f, #52b788); 
            color: white; border: none; font-weight: bold;
        }
        label { display: block; padding: 10px; margin: 5px 0; background: #f8f9fa; border-radius: 10px; cursor: pointer; }
        #ket-qua { text-align: center; margin-top: 30px; }
        .loi-giai { font-style: italic; color: #d90429; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h1>🌿 EzMath 🌿</h1>
        <p>Chào mừng các em đến với thử thách hôm nay! ✨</p>
        <input type="text" id="student-name" class="input-login" placeholder="👤 Nhập họ và tên...">
        <input type="password" id="student-code" class="input-login" placeholder="🔑 Nhập mã bí mật...">
        <br>
        <button onclick="checkLogin()">🚀 BẮT ĐẦU THỬ THÁCH</button>
    </div>

    <div id="main-content" style="display:none;">
        <h1>✍️ BÀI TẬP RÈN LUYỆN</h1>
        <div id="dong-ho">⏳ Thời gian còn lại: 15:00</div>
        <div id="vung-chua"></div>
        <div style="text-align: center;">
            <button id="btn-nop-bai" onclick="chamDiem()">✔️ HOÀN THÀNH & NỘP BÀI</button>
            <button onclick="location.reload()">🔄 LÀM ĐỀ MỚI</button>
        </div>
        <div id="ket-qua"></div>
    </div>
</div>

<script>
    // 1. KHAI BÁO BIẾN & ÂM THANH
    var studentNameStored = "";
    var giay = 900; 
    var timer;
    var daNopBai = false;
    var soLanViPham = 0;
    const GIOI_HAN_VI_PHAM = 3;

    // Nạp âm thanh (Tớ đã dùng link ổn định hơn)
    var sndStart = new Audio('https://www.myinstants.com/fr/instant/quick-ting-57430/?utm_source=copy&utm_medium=share');
    var sndAlert = new Audio('https://www.myinstants.com/fr/instant/mamboman-bo-shi-ge-ju-matikanetannhauser-9173/?utm_source=copy&utm_medium=share');
    var sndSuccess = new Audio('https://www.myinstants.com/fr/instant/anime-wow/?utm_source=copy&utm_medium=share');

    var danhSachHocSinh = { "Nguyễn Văn An": "an123", "Trần Thị Bình": "binh456", "Khánh": "0512" };
    var danhSach = [
        { de: "15 + 25 bằng bao nhiêu?", luaChon: ["30", "35", "40", "45"], dung: "40" },
        { de: "Hình tam giác có mấy cạnh?", luaChon: ["2", "3", "4", "5"], dung: "3" },
        { de: "Số nào lớn nhất: 89, 98, 100, 99?", luaChon: ["89", "98", "100", "99"], dung: "100" }
    ];

    // 2. LOGIC ĐĂNG NHẬP
    function checkLogin() {
        var n = document.getElementById('student-name').value.trim();
        var c = document.getElementById('student-code').value.trim();
        if (danhSachHocSinh[n] && danhSachHocSinh[n] === c) {
            studentNameStored = n;
            sndStart.play(); // Âm thanh khi bắt đầu
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            taoDe();
            batDauDemNguoc();
        } else { alert("Sai thông tin rồi em ơi! ❌"); }
    }

    function batDauDemNguoc() {
        timer = setInterval(function() {
            if (daNopBai) return;
            var p = Math.floor(giay / 60), g = giay % 60;
            document.getElementById('dong-ho').innerHTML = "⏳ Thời gian còn lại: " + p + ":" + (g < 10 ? "0" + g : g);
            if (giay-- <= 0) { clearInterval(timer); chamDiem(); }
        }, 1000);
    }

    var danhSachHienTai = [];
    function taoDe() {
        var v = document.getElementById('vung-chua'); v.innerHTML = "";
        danhSachHienTai = JSON.parse(JSON.stringify(danhSach)).sort(() => 0.5 - Math.random());
        danhSachHienTai.forEach((item, i) => {
            var html = `<div class='khung' id='box${i}'><p><b>📝 Câu ${i+1}: ${item.de}</b></p>`;
            item.luaChon.forEach(lc => {
                html += `<label><input type='radio' name='cau${i}' value='${lc}'> ${lc}</label>`;
            });
            html += `<div class='loi-giai' id='note${i}'>💡 Đáp án đúng: ${item.dung}</div></div>`;
            v.innerHTML += html;
        });
    }

    function chamDiem() {
        if (daNopBai) return; 
        daNopBai = true; 
        clearInterval(timer);
        sndSuccess.play(); // Âm thanh thành công

        var d = 0;
        danhSachHienTai.forEach((item, i) => {
            var chon = Array.from(document.getElementsByName('cau'+i)).find(r => r.checked)?.value;
            var b = document.getElementById('box'+i);
            if (chon === item.dung) { d++; b.classList.add('cau-dung'); }
            else { b.classList.add('cau-sai'); document.getElementById('note'+i).style.display = "block"; }
        });

        var diem = Math.round((d/danhSach.length)*100)/10;
        document.getElementById('ket-qua').innerHTML = `<h2>🏆 Kết quả: ${diem} điểm</h2>`;
        document.getElementById('btn-nop-bai').style.display = "none";
    }

    // 3. CHỐNG GIAN LẬN
    document.addEventListener("visibilitychange", function() {
        if (document.visibilityState === 'hidden' && !daNopBai && studentNameStored !== "") {
            soLanViPham++;
            sndAlert.play(); // Âm thanh cảnh báo
            if (soLanViPham < GIOI_HAN_VI_PHAM) {
                alert("⚠️ CẢNH BÁO: Đừng rời trang làm bài! Lần " + soLanViPham);
            } else {
                alert("❌ VI PHẠM QUÁ GIỚI HẠN! Tự động nộp bài.");
                chamDiem();
            }
        }
    });
</script>
</body>
</html>
