<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học toán cùng Khánh - Phiên bản Đại diện</title>
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #40916c;
            --light: #d8f3dc;
            --accent: #ff9f1c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 40px 20px; 
            background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%); 
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ĐIỀU CHỈNH ĐỂ FORM TO HẲN RA */
        .container { 
            width: 100%;
            max-width: 1100px; /* Tăng mạnh từ 900px lên 1100px */
            min-height: 600px; /* Ép chiều cao tối thiểu để form trông to hơn */
            background: rgba(255, 255, 255, 0.98); 
            padding: 60px; /* Tăng padding cực đại */
            border-radius: 50px; 
            box-shadow: 0 30px 80px rgba(0,0,0,0.2); 
            box-sizing: border-box;
        }

        h1 { text-align: center; color: var(--primary); font-size: 50px; margin-bottom: 40px; }

        #login-screen { text-align: center; padding: 40px 0; }
        
        /* CÁC Ô NHẬP LIỆU PHIÊN BẢN LỚN */
        .input-login { 
            padding: 25px; 
            border: 3px solid #b7e4c7; /* Làm viền dày hơn */
            border-radius: 25px; 
            width: 100%; 
            max-width: 600px; /* Nới rộng ô nhập liệu */
            margin-bottom: 25px; 
            font-size: 24px; /* Chữ cực to */
            transition: 0.3s;
            text-align: center;
            display: inline-block;
        }
        .input-login:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 20px rgba(64,145,108,0.3); }

        #dong-ho { 
            font-size: 32px; font-weight: bold; color: #e63946; 
            text-align: center; margin-bottom: 40px; padding: 30px; 
            background: #fff1f2; border-radius: 30px; border: 3px solid #ffccd5;
        }

        #progress-container { width: 100%; background: #eee; border-radius: 20px; margin-bottom: 40px; height: 25px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #40916c, #2dc653); transition: 0.5s; }

        .khung { 
            padding: 40px; margin-bottom: 35px; border-radius: 30px; 
            background: white; border: 1px solid #e9ecef;
            border-left: 15px solid var(--secondary);
            font-size: 22px; /* Câu hỏi to hơn */
        }

        .cau-dung { border-left-color: #2dc653 !important; background: #f0fff4; }
        .cau-sai { border-left-color: #e63946 !important; background: #fff5f5; animation: shake 0.5s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        button { 
            padding: 25px 80px; cursor: pointer; 
            background: linear-gradient(45deg, #2d6a4f, #52b788); 
            color: white; border: none; border-radius: 80px; 
            font-weight: bold; font-size: 26px; transition: 0.3s;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 15px 35px rgba(45,106,79,0.4); }

        label { display: block; padding: 20px; margin: 15px 0; border-radius: 20px; background: #f8f9fa; cursor: pointer; font-size: 20px; }
        input[type='radio'] { accent-color: var(--secondary); transform: scale(2); margin-right: 20px; }
        .loi-giai { font-size: 20px; color: #d90429; margin-top: 20px; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Nội dung Body và Script giữ nguyên như bản trước của cậu -->
    <div class="container">
        <div id="login-screen">
            <h1>🌿 EzMath 🌿</h1>
            <p style="font-size: 22px; color: #666;">Chào mừng các em đến với thử thách hôm nay! ✨</p>
            <input type="text" id="student-name" class="input-login" placeholder="👤 Nhập họ và tên..."><br>
            <input type="password" id="student-code" class="input-login" placeholder="🔑 Nhập mã bí mật..."><br>
            <button id="btn-login">🚀 BẮT ĐẦU THỬ THÁCH</button>
        </div>

        <div id="main-content" style="display:none;">
            <h1>✍️ BÀI TẬP RÈN LUYỆN</h1>
            <div id="progress-container"><div id="progress-bar"></div></div>
            <div id="dong-ho">⏳ Thời gian còn lại: 15:00</div>
            <div id="vung-chua"></div>
            <div style="text-align: center;">
                <button id="btn-nop-bai">✔️ NỘP BÀI</button>
            </div>
            <div id="ket-qua"></div>
        </div>
    </div>

    <script>
        // Copy toàn bộ phần Script từ phiên bản trước của cậu vào đây
        // (Giữ nguyên logic đăng nhập và chấm điểm của cậu)
    </script>
</body>
</html>
