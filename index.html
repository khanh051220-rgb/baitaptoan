<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học toán cùng Khánh</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/188/188333.png">
    <style>
        :root { --primary: #1b4332; --secondary: #40916c; --light: #d8f3dc; --accent: #ff9f1c; }
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%); min-height: 100vh; margin: 0; display: flex; justify-content: center; }
        .container { width: 95%; max-width: 1000px; background: rgba(255, 255, 255, 0.95); padding: 45px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); font-size: 32px; margin-bottom: 20px; }
        #login-screen { text-align: center; }
        .input-login { padding: 15px; border: 2px solid #b7e4c7; border-radius: 15px; width: 85%; max-width: 350px; margin-bottom: 15px; text-align: center; }
        .avatar-picker { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .avatar-option { width: 60px; height: 60px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: 0.3s; object-fit: cover; }
        .avatar-option.selected { border-color: var(--accent); transform: scale(1.1); }
        .header-profile { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; background: #f0fdf4; padding: 10px; border-radius: 50px; }
        .header-profile img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        #progress-container { width: 100%; background: #eee; border-radius: 10px; margin-bottom: 25px; height: 15px; overflow: hidden; display:none; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #40916c, #2dc653); transition: 0.4s; }
        #dong-ho { font-size: 22px; font-weight: bold; color: #e63946; text-align: center; margin-bottom: 25px; padding: 15px; background: #fff1f2; border-radius: 20px; border: 2px solid #ffccd5; }
        .khung { padding: 25px; margin-bottom: 25px; border-radius: 20px; background: white; border-left: 10px solid var(--secondary); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .cau-dung { border-left-color: #2dc653 !important; background: #f0fff4; }
        .cau-sai { border-left-color: #e63946 !important; background: #fff5f5; }
        button { padding: 15px 35px; cursor: pointer; background: linear-gradient(45deg, #2d6a4f, #52b788); color: white; border: none; border-radius: 50px; font-weight: bold; }
        label { display: block; padding: 12px; margin: 8px 0; border-radius: 12px; background: #f8f9fa; cursor: pointer; }
        input[type='radio'] { accent-color: var(--secondary); transform: scale(1.2); }
        .loi-giai { margin-top: 15px; padding: 15px; border-radius: 10px; display: none; line-height: 1.5; }
    </style>
</head>
<body>
    <!-- TRỢ LÝ AI -->
    <div id="ai-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
        <div id="ai-bubble" style="background: white; border: 2px solid var(--secondary); padding: 10px 15px; border-radius: 20px; margin-bottom: 10px; font-size: 13px; max-width: 250px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); position: relative;">
            <span id="ai-speech"></span>
            <div style="position: absolute; bottom: -10px; right: 20px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 10px solid var(--secondary);"></div>
        </div>
        <div id="chat-box" style="width: 280px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 2px solid var(--secondary); overflow: hidden; display: flex; flex-direction: column;">
            <div style="background: var(--secondary); color: white; padding: 10px; font-weight: bold; display: flex; justify-content: space-between;">
                <span>💬 TRỢ LÝ EZMATH</span>
                <span id="ask-count" style="font-size: 11px;">Lượt hỏi: 2/2</span>
            </div>
            <div id="chat-content" style="height: 120px; overflow-y: auto; padding: 10px; font-size: 12px; background: #f9f9f9;"></div>
            <div style="display: flex; border-top: 1px solid #eee;">
                <input type="text" id="user-input" placeholder="Hỏi gì đi em..." style="flex: 1; border: none; padding: 10px; outline: none;">
                <button id="btn-send" style="padding: 10px; border-radius: 0; width: 60px; font-size: 12px;">Gửi</button>
            </div>
        </div>
    </div>

    <audio id="sound-click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
    <audio id="sound-success" src="https://www.soundjay.com/human/sounds/applause-01.mp3"></audio>
    <audio id="sound-denied" src="https://www.soundjay.com/buttons/sounds/beep-05.mp3"></audio>

    <div class="container">
        <div id="login-screen">
            <h1>🌿 EzMath 🌿</h1>
            <p>Chọn một avatar thật ngầu nhen các em! ✨</p>
            <div class="avatar-picker">
                <img src="https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg" class="avatar-option selected" data-seed="https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg">
                <img src="https://i.pinimg.com/originals/6d/dc/3f/6ddc3f9a79c891e0efd6042624e08f51.png" class="avatar-option" data-seed="https://i.pinimg.com/originals/6d/dc/3f/6ddc3f9a79c891e0efd6042624e08f51.png">
                <img src="https://antimatter.vn/wp-content/uploads/2022/03/anh-anime-nam-chibi-meo-cute.jpg" class="avatar-option" data-seed="https://antimatter.vn/wp-content/uploads/2022/03/anh-anime-nam-chibi-meo-cute.jpg">
            </div>
            <input type="text" id="student-name" class="input-login" placeholder="👤 Nhập họ và tên..."><br>
            <input type="password" id="student-code" class="input-login" placeholder="🔑 Nhập mã bí mật..."><br>
            <button id="btn-login">🚀 BẮT ĐẦU THỬ THÁCH</button>
        </div>

        <div id="main-content" style="display:none;">
            <div id="profile-header" class="header-profile">
                <img id="user-img" src="">
                <span id="user-name" style="font-weight: bold;"></span>
            </div>
            <h1>✍️ BÀI TẬP RÈN LUYỆN</h1>
            <div id="progress-container"><div id="progress-bar"></div></div>
            <div id="dong-ho">⏳ Thời gian còn lại: 15:00</div>
            <div id="vung-chua"></div>
            <div style="text-align: center;">
                <button id="btn-nop-bai">✔️ HOÀN THÀNH & NỘP BÀI</button>
            </div>
            <div id="ket-qua"></div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
    var studentNameStored = "", giay = 900, timer, daNopBai = false, soLanViPham = 0, soLuotHoi = 2;
    var currentSeed = "https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg";
    const SO_CAU_MOI_DE = 5;
    var danhSachHocSinh = { "Nguyễn Văn An": "an123", "Trần Thị Bình": "binh456", "Khánh": "0512" };

    var khoCauHoi = [
        { de: "15 + 25 bằng bao nhiêu?", luaChon: ["30", "35", "40", "45"], dung: "40", giaiThich: "15 + 25 = 40", goiY: "Cộng hàng chục trước nhé!" },
        { de: "Hình tam giác có mấy cạnh?", luaChon: ["2", "3", "4", "5"], dung: "3", giaiThich: "Tam giác có 3 cạnh.", goiY: "Tam là 3 đó em." },
        { de: "Kết quả của 7 x 8?", luaChon: ["54", "56", "64", "49"], dung: "56", giaiThich: "7 x 8 = 56", goiY: "Bảng cửu chương 7 nè." }
    ];
    var danhSachHienTai = [];

    // Chọn Avatar
    document.querySelectorAll('.avatar-option').forEach(opt => {
        opt.onclick = function() {
            document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('selected'));
            this.classList.add('selected');
            currentSeed = this.dataset.seed;
            document.getElementById('sound-click').play();
        };
    });

    // Login
    document.getElementById('btn-login').onclick = function() {
        var n = document.getElementById('student-name').value.trim();
        var c = document.getElementById('student-code').value.trim();
        if (danhSachHocSinh[n] === c) {
            studentNameStored = n;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            document.getElementById('progress-container').style.display = "block";
            document.getElementById('user-img').src = currentSeed;
            document.getElementById('user-name').innerText = studentNameStored;
            taoDe();
            batDauDemNguoc();
            aiNoi("Chào " + studentNameStored + "! Anh là trợ lý của Khánh. Đừng có hack nhé! 😂");
        } else { alert("Sai thông tin rồi em ơi! ❌"); }
    };

    function taoDe() {
        var v = document.getElementById('vung-chua');
        danhSachHienTai = khoCauHoi.sort(() => 0.5 - Math.random()).slice(0, SO_CAU_MOI_DE);
        danhSachHienTai.forEach((item, i) => {
            let html = `<div class="khung" id="box${i}"><p><b>Câu ${i+1}: ${item.de}</b></p>`;
            item.luaChon.forEach(lc => { html += `<label><input type="radio" name="cau${i}" value="${lc}"> ${lc}</label>`; });
            html += `<div class="loi-giai" id="note${i}"></div></div>`;
            v.innerHTML += html;
        });
    }

    function batDauDemNguoc() {
        timer = setInterval(() => {
            if (daNopBai) return;
            giay--;
            let p = Math.floor(giay/60), g = giay%60;
            document.getElementById('dong-ho').innerText = `⏳ Thời gian còn lại: ${p}:${g<10?'0'+g:g}`;
            if (giay <= 0) chamDiem();
        }, 1000);
    }

    function chamDiem() {
        if (daNopBai) return;
        daNopBai = true;
        clearInterval(timer);
        let dung = 0;
        danhSachHienTai.forEach((item, i) => {
            let chon = document.querySelector(`input[name="cau${i}"]:checked`)?.value;
            let note = document.getElementById(`note${i}`);
            note.style.display = "block";
            if(chon === item.dung) { dung++; document.getElementById(`box${i}`).classList.add('cau-dung'); note.innerHTML = "✅ Đúng!"; }
            else { document.getElementById(`box${i}`).classList.add('cau-sai'); note.innerHTML = `❌ Sai. Đáp án: ${item.dung}`; }
        });
        document.getElementById('ket-qua').innerHTML = `<h2>Kết quả: ${dung}/${SO_CAU_MOI_DE}</h2>`;
    }

    document.getElementById('btn-nop-bai').onclick = chamDiem;

    // --- AI VÀ CẢNH BÁO HÀI HƯỚC ---
    function aiNoi(msg) {
        const bubble = document.getElementById('ai-bubble');
        document.getElementById('ai-speech').innerText = msg;
        bubble.style.display = 'block';
        setTimeout(() => bubble.style.display = 'none', 4000);
    }

    // Chặn F12 với câu thoại hài hước
    window.addEventListener('keydown', function(e) {
        const canhBao = [
            "⚠️ Ui da! Đừng soi code của thầy mà, lo làm bài đi em ơi!",
            "🤫 Tính hack hay gì? Tập trung chuyên môn đi nhen!",
            "🚫 Cửa này không vào được đâu em, quay lại làm toán thôi!",
            "🕵️ Phát hiện một thám tử nhí đang soi code! Dừng lại ngay!",
            "🛑 Hệ thống đang quan sát em... đừng nghịch F12 nữa nhé!"
        ];
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
            e.preventDefault();
            document.getElementById('sound-denied').play();
            alert(canhBao[Math.floor(Math.random() * canhBao.length)]);
        }
    });

    // Chat xử lý gợi ý
    document.getElementById('btn-send').onclick = function() {
        let msg = document.getElementById('user-input').value.toLowerCase();
        let content = document.getElementById('chat-content');
        if(!msg) return;
        content.innerHTML += `<p><b>Em:</b> ${msg}</p>`;
        
        if (soLuotHoi <= 0) {
            content.innerHTML += `<p style="color:red"><b>AI:</b> Hết lượt rồi, tự bơi đi em!</p>`;
        } else if (msg.includes("gợi ý câu")) {
            let num = parseInt(msg.match(/\d+/)) - 1;
            if (num >= 0 && num < SO_CAU_MOI_DE) {
                content.innerHTML += `<p><b>AI:</b> ${danhSachHienTai[num].goiY}</p>`;
                soLuotHoi--;
                document.getElementById('ask-count').innerText = `Lượt hỏi: ${soLuotHoi}/2`;
            }
        } else if (msg.includes("yêu")) {
            content.innerHTML += `<p><b>AI:</b> Mẫu người yêu của anh là người giỏi Toán! Lo làm bài đi! 💖</p>`;
        } else {
            content.innerHTML += `<p><b>AI:</b> Em hỏi 'Gợi ý câu 1' chẳng hạn nhé!</p>`;
        }
        document.getElementById('user-input').value = "";
        content.scrollTop = content.scrollHeight;
    };
</script>
</body>
</html>
