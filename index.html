<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EzMath - Học Toán Cùng Khánh</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/188/188333.png">
    
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #40916c;
            --light: #d8f3dc;
            --accent: #ff9f1c;
            --bg-body: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%);
            --bg-container: rgba(255, 255, 255, 0.95);
            --text-main: #1b4332;
            --box-bg: #ffffff;
            --box-border: #e9ecef;
            --label-bg: #f8f9fa;
        }

        body.dark-mode {
            --primary: #52b788;
            --secondary: #40916c;
            --light: #1b4332;
            --bg-body: linear-gradient(135deg, #081c15 0%, #1b4332 100%);
            --bg-container: rgba(27, 67, 50, 0.98);
            --text-main: #d8f3dc;
            --box-bg: #2d6a4f;
            --box-border: #40916c;
            --label-bg: #1b4332;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-body); 
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            transition: 0.5s;
        }

        .container { 
            width: 90%;
            max-width: 600px; 
            background: var(--bg-container); 
            padding: 40px; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            position: relative;
        }

        h1 { text-align: center; color: var(--primary); margin-bottom: 5px; }

        /* Sắp xếp ô nhập liệu theo chiều dọc */
        #login-screen { 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center; 
        }

        .input-group {
            width: 100%;
            max-width: 350px;
            margin-bottom: 15px;
        }

        .input-login { 
            width: 100%;
            padding: 15px;
            border: 2px solid var(--secondary);
            border-radius: 15px; 
            font-size: 16px;
            background: var(--box-bg);
            color: var(--text-main);
            box-sizing: border-box; /* Đảm bảo padding không làm tràn chiều rộng */
            outline: none;
        }

        /* Avatar Picker */
        .avatar-picker { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .avatar-option {
            width: 65px; height: 65px; border-radius: 50%; border: 3px solid transparent;
            cursor: pointer; transition: 0.3s; object-fit: cover;
        }
        .avatar-option.selected { border-color: var(--accent); transform: scale(1.1); }

        /* Nút Dark Mode */
        #theme-btn {
            cursor: pointer; font-size: 24px; background: var(--box-bg);
            padding: 12px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.5s; display: flex; align-items: center; justify-content: center;
            width: 50px; height: 50px; margin-top: 20px;
            border: 2px solid var(--secondary);
        }

        body.in-game #theme-btn { position: absolute; top: 20px; right: 20px; margin: 0; }

        button { 
            padding: 15px 40px; cursor: pointer; 
            background: linear-gradient(45deg, #2d6a4f, #52b788); 
            color: white; border: none; border-radius: 50px; 
            font-weight: bold; font-size: 17px; margin-top: 10px;
        }

        /* Giao diện làm bài */
        .header-profile {
            display: flex; align-items: center; justify-content: center; gap: 15px;
            margin-bottom: 25px; background: var(--light); padding: 10px; border-radius: 50px;
        }
        .header-profile img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--secondary); object-fit: cover; }
        
        #progress-container { width: 100%; background: #eee; border-radius: 10px; margin-bottom: 20px; height: 12px; overflow: hidden; display:none; }
        #progress-bar { width: 0%; height: 100%; background: #2dc653; transition: 0.5s; }

        .khung { 
            padding: 20px; margin-bottom: 20px; border-radius: 15px; 
            background: var(--box-bg); border-left: 8px solid var(--secondary);
            border-top: 1px solid var(--box-border); border-right: 1px solid var(--box-border); border-bottom: 1px solid var(--box-border);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="container">
    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen">
        <h1>🌿 EzMath 🌿</h1>
        <p style="margin-top: 0;">Chọn avatar và nhập thông tin nhé!</p>
        
        <div class="avatar-picker">
            <img src="https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg" class="avatar-option selected" data-url="https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg">
            <img src="https://i.pinimg.com/originals/6d/dc/3f/6ddc3f9a79c891e0efd6042624e08f51.png" class="avatar-option" data-url="https://i.pinimg.com/originals/6d/dc/3f/6ddc3f9a79c891e0efd6042624e08f51.png">
            <img src="https://i.pinimg.com/originals/9a/c3/55/9ac355832f81c37f4964583c22bee6a0.jpg" class="avatar-option" data-url="https://i.pinimg.com/originals/9a/c3/55/9ac355832f81c37f4964583c22bee6a0.jpg">
            <img src="https://antimatter.vn/wp-content/uploads/2022/03/anh-anime-nam-chibi-meo-cute.jpg" class="avatar-option" data-url="https://antimatter.vn/wp-content/uploads/2022/03/anh-anime-nam-chibi-meo-cute.jpg">
        </div>

        <div class="input-group">
            <input type="text" id="student-name" class="input-login" placeholder="👤 Nhập họ và tên...">
        </div>
        <div class="input-group">
            <input type="password" id="student-code" class="input-login" placeholder="🔑 Nhập mã bí mật...">
        </div>

        <button id="btn-login">🚀 VÀO LÀM BÀI NGAY</button>
        
        <div id="theme-btn">🌙</div>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div id="main-content" style="display:none;">
        <div id="profile-header" class="header-profile">
            <img id="user-img" src="">
            <span id="user-name" style="font-weight: bold;"></span>
        </div>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div id="vung-chua"></div>
        <div style="text-align: center;">
            <button id="btn-nop-bai">✔️ HOÀN THÀNH</button>
        </div>
        <div id="ket-qua"></div>
    </div>
</div>

<script>
    let studentName = "", currentAvatar = "https://img5.thuthuatphanmem.vn/uploads/2021/11/08/anh-gau-truc-cute_082040722.jpg";
    const danhSachHocSinh = { "Khánh": "0512", "Admin": "123" };

    // Dark Mode
    document.getElementById('theme-btn').addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        this.innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    });

    // Chọn Avatar
    document.querySelectorAll('.avatar-option').forEach(img => {
        img.addEventListener('click', function() {
            document.querySelectorAll('.avatar-option').forEach(i => i.classList.remove('selected'));
            this.classList.add('selected');
            currentAvatar = this.dataset.url;
        });
    });

    // Đăng nhập
    document.getElementById('btn-login').addEventListener('click', function() {
        const name = document.getElementById('student-name').value.trim();
        const code = document.getElementById('student-code').value.trim();

        if (danhSachHocSinh[name] === code) {
            studentName = name;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            document.getElementById('progress-container').style.display = "block";
            document.body.classList.add('in-game');
            document.getElementById('user-img').src = currentAvatar;
            document.getElementById('user-name').innerText = studentName;
            
            // Ở đây cậu gọi hàm taoDe() của cậu nhé
            document.getElementById('vung-chua').innerHTML = "<p style='text-align:center;'>Đề bài của cậu sẽ hiện ở đây...</p>";
        } else {
            alert("Sai tên hoặc mã rồi em ơi!");
        }
    });
</script>

</body>
</html>
